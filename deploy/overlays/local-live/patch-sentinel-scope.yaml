# Patch: pin the Sentinel's watch scope to the namespace it is granted.
#
# Applied by ./kustomization.yaml to the `srek3s-sentinel` Deployment.
#
# ---------------------------------------------------------------------------
# WHY THIS PATCH EXISTS AT ALL
# ---------------------------------------------------------------------------
# `deploy/sentinel.yaml` ships `WATCH_NAMESPACE: srek3s-system` alongside a Role
# that grants read verbs in exactly that namespace, so the base is already
# coherent: scope and authority agree, and installing the base of record
# produces an authorised watcher with nothing in its error log.
#
# An earlier revision of this overlay set the scope to `sentinel-chaos` and
# added ./chaos-rbac.yaml to grant the verbs there. That pairing was internally
# correct - scope inside the grant - and it worked in CI. It was still wrong for
# this repository, because `sentinel-chaos` is a *fixture* namespace that only
# exists while a chaos run is in flight. A real deployment pointed at it watches
# an empty namespace the rest of the time and reports nothing at all, with no
# error to explain why.
#
# Drift made this concrete. The cluster this overlay is used against had been
# running the sentinel scoped to `srek3s-system` while this file said
# `sentinel-chaos`, so `make deploy-overlay` silently changed the deployed watch
# scope on every run. Reconciling the file to the running state is what keeps the
# overlay honest: the overlay now declares the same scope the base declares, and
# it agrees with what is deployed.
#
# ---------------------------------------------------------------------------
# WHY NOT A ClusterRole, AND WHY NOT EMPTY
# ---------------------------------------------------------------------------
# Empty means every namespace, which a namespaced Role never authorises - the
# informer retries a forbidden cluster-wide LIST forever and the operator sees no
# incidents and no useful error. A ClusterRole would make the mismatch disappear
# and is the single highest-severity change available to this codebase: a
# watcher's entire authority is the set of things it can read, and a cluster-wide
# grant reads every namespace, including those holding other people's secrets.
# Scoping the grant keeps the blast radius of a compromised Sentinel equal to one
# namespace rather than the cluster.
#
# A chaos run that wants the sentinel scoped to `sentinel-chaos` says so at
# install time instead - the Helm chart exposes `sentinel.watchNamespace`, and
# `make throwaway-detonate` sets it - so the e2e leg still exercises
# cross-namespace RBAC without the production overlay inheriting a fixture scope.
#
# ---------------------------------------------------------------------------
# WHY ./chaos-rbac.yaml STILL EXISTS
# ---------------------------------------------------------------------------
# It grants the read verbs in `sentinel-chaos`, which the throwaway leg needs
# once `make throwaway-detonate` points the sentinel there. Deleting it would
# break that leg; keeping it costs nothing, because a Role in a namespace the
# sentinel is not watching confers no reach. Its own comments state that pairing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srek3s-sentinel
spec:
  template:
    spec:
      containers:
        - name: sentinel
          env:
            # Kept as an env var rather than the `-namespace` flag so the manifest
            # remains the single source of truth for how the pod is configured: the
            # flag is read by `cmd/sentinel/main.go` as `os.Getenv("WATCH_NAMESPACE")`,
            # so the two are the same input and setting it here changes what the
            # flag would report anyway. The startup log line echoes the scope the
            # WATCHER reports, not the flag's value — asserting on that line is the
            # only check that would catch a scope that was set but not applied,
            # which is the exact defect that `internal/k8s`'s namespace tests exist
            # to prevent.
            - name: WATCH_NAMESPACE
              value: srek3s-system
