apiVersion: v1
kind: Service
metadata:
  name: srek3s-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: srek3s-agent
    {{- include "srek3s.partOf" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: srek3s-agent
    app.kubernetes.io/part-of: srek3s
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
