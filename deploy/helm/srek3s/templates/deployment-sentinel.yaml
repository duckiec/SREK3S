apiVersion: apps/v1
kind: Deployment
metadata:
  name: srek3s-sentinel
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: srek3s-sentinel
    {{- include "srek3s.partOf" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: srek3s-sentinel
      srek3s.io/component: sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srek3s-sentinel
        srek3s.io/component: sentinel
        {{- include "srek3s.partOf" . | nindent 8 }}
      annotations:
        checksum/sentinel: "replaced-by-pipeline"
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: srek3s-sentinel
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sentinel
          image: {{ .Values.images.sentinel.repository }}:{{ .Values.images.sentinel.tag }}
          imagePullPolicy: {{ .Values.images.sentinel.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 9090
          args:
            - -log-level=$(LOG_LEVEL)
          env:
            - name: LOG_LEVEL
              value: info
            - name: SREK3S_AGENT_URL
              value: http://srek3s-agent:8000
            - name: SREK3S_SCRUBBER_MANIFEST
              value: /etc/srek3s/scrubber.json
            - name: WATCH_NAMESPACE
              value: {{ .Values.sentinel.watchNamespace | quote }}
            - name: TMPDIR
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: scrubber-manifest
              mountPath: /etc/srek3s
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1"
              ephemeral-storage: "128Mi"
          livenessProbe:
            exec:
              command: ["/bin/sentinel", "-version"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      terminationGracePeriodSeconds: 45
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: scrubber-manifest
          configMap:
            name: srek3s-scrubber
