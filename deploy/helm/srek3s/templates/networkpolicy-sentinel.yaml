apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: srek3s-sentinel
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: srek3s-sentinel
    {{- include "srek3s.partOf" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: srek3s-sentinel
  policyTypes:
    - Egress
    - Ingress
  {{- if .Values.monitoring.namespace }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoring.namespace }}
      ports:
        - protocol: TCP
          port: 9090
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - to:
        {{- range .Values.networkPolicy.apiServerCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    # -------------------------------------------------------------------------
    # THE SAME API SERVER, AS IT LOOKS AFTER DNAT.
    #
    # Inert on a pre-DNAT CNI (the rule above already matched). REQUIRED on
    # kube-router, k3s's default, where the ClusterIP is rewritten to the
    # apiserver's node address BEFORE policy is evaluated. Without this rule the
    # Sentinel cannot watch its own cluster on a default k3s install, and it
    # fails with `dial tcp 10.43.0.1:443: connect: connection refused` while the
    # packet capture shows a perfectly healthy DNAT.
    #
    # Permitted by PORT rather than by address: the port is stable across
    # reboots, the node address is not.
    # -------------------------------------------------------------------------
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.apiServerPort }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: srek3s-agent
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
