apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: srek3s-agent-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srek3s.partOf" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: srek3s-agent
  policyTypes:
    - Egress
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: srek3s-sentinel
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
