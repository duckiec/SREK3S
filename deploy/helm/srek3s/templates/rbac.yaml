apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: srek3s-sentinel
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: srek3s-sentinel
    {{- include "srek3s.partOf" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # No `apps` rule. deploy/rbac.yaml is the file of record and its comment explains
  # the removal; this template exists to match it byte for byte, and the parity gate
  # fails if it does not. Kept in step deliberately rather than independently.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: srek3s-sentinel
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: srek3s-sentinel
    {{- include "srek3s.partOf" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: srek3s-sentinel
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: srek3s-sentinel
  apiGroup: rbac.authorization.k8s.io
