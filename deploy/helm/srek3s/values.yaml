# SREK3S chart defaults. With these values `helm template` renders the same
# objects as `kubectl kustomize deploy/base`. Override only what your cluster
# requires.
images:
  sentinel:
    repository: registry.internal/srek3s-sentinel
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  agent:
    repository: registry.internal/srek3s-agent
    tag: "0.1.0"
    pullPolicy: IfNotPresent

sentinel:
  # Namespace the informer watches. Defaults to the release namespace's own
  # value, which is the namespace deploy/rbac.yaml actually grants. To observe
  # more, change this AND grant the read verbs there with a RoleBinding
  # referring back to the ServiceAccount. Never use a ClusterRole.
  watchNamespace: srek3s-system

agent:
  # Repository-relative path, inside the cloned GitOps checkout, of the manifest
  # this agent is allowed to patch.
  #
  # Left empty by default, which means the agent falls back to
  # classifier.DEFAULT_TARGET_MANIFEST. That default is
  # "deploy/payments/checkout-api.yaml", which does not exist in this
  # repository, so an unset value makes every incident escalate under I-B2 with
  # the reason "target manifest is unreadable" - a message that reads like a
  # broken checkout rather than a missing configuration key.
  #
  # Set it whenever agent.gitops.repoUrl is set, e.g.
  #   --set agent.gitops.repoUrl=https://github.com/duckiec/SREK3S.git \
  #   --set agent.targetManifest=deploy/chaos/oom-leak.yaml
  # and Tier-1 becomes reachable. The path must also be present in the checkout.
  targetManifest: ""
  gitops:
    # Repository to clone at startup for Tier-1 verification. Empty means
    # the existing behaviour: SREK3S_MANIFEST_ROOT if mounted, otherwise
    # every incident escalates. The token always comes from the
    # srek3s-secrets Secret, never from values.
    repoUrl: ""
    ref: main

monitoring:
  # Namespace Prometheus scrapes from. Empty means deny: no ingress rule is
  # rendered and :9090 is unreachable until the operator names a namespace.
  namespace: ""

networkPolicy:
  # Service CIDRs the Sentinel may reach on 443. Defaults cover k3s and
  # kubeadm. If your control plane sits elsewhere, replace this list.
  apiServerCidrs:
    - 10.43.0.0/16
    - 10.96.0.0/12
