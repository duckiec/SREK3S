# SREK3S Sentinel - Kubernetes deployment.
#
# The same hardening block as deploy/agent.yaml (ROADMAP 3.6.3, ARCHITECTURE.md §8):
# UID/GID 10001, read-only root filesystem, all capabilities dropped, no privilege
# escalation, RuntimeDefault seccomp, and a single writable emptyDir at /tmp.
#
# Duplicated rather than templated on purpose. A YAML templating layer would make
# the *rendered* manifest differ from the *committed* one, and the test that asserts
# these hardening fields (ROADMAP 3.6.4) reads the committed file. A field that only
# exists after rendering is a field the test cannot see, and hardening that cannot
# be asserted is hardening that decays.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srek3s-sentinel
  namespace: srek3s-system
  labels:
    app.kubernetes.io/name: srek3s-sentinel
    app.kubernetes.io/part-of: srek3s
spec:
  # A single replica, deliberately. Two would double-emit every incident: the
  # informer's dedup cache is per-process, so two watchers would each admit the
  # same failure and the agent would triage it twice - two remediation PRs for one
  # outage. Leader election would fix that at the cost of a dependency and a
  # failover window; at one replica it is not needed.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    # Recreate, not RollingUpdate. There is exactly one replica by design, and
    # two watchers would double-emit every incident (the informer's dedup cache
    # is per-process, so each admits the same failure and the agent triaged
    # it twice). RollingUpdate's default maxUnavailable=0/maxSurge=1 would
    # start the new pod BEFORE killing the old one — i.e. it engineers the
    # exact two-watcher window this manifest's design exists to avoid.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: srek3s-sentinel
      # THE DISCRIMINATOR. A Deployment's selector must identify its OWN pods and
      # nothing else on the cluster, and `app.kubernetes.io/name` alone does not.
      #
      # The e2e fixtures — the capture proxy and the route probe — deliberately
      # impersonate `app.kubernetes.io/name: srek3s-sentinel`, because that is the
      # label deploy/agent.yaml's ingress NetworkPolicy admits. So the Sentinel's
      # selector also matched three other components' pods:
      #
      #     selector of srek3s-sentinel -> matched by
      #       ['srek3s-capture', 'srek3s-route-probe', 'srek3s-sentinel']
      #
      # and `kubectl logs deployment/srek3s-sentinel` returned the CAPTURE PROXY's
      # stdout. The step asserting the Sentinel reported its namespace scope read
      # the wrong component entirely and reported "the in-cluster Sentinel did not
      # report a namespace scope" — a confident, specific, wrong answer.
      #
      # This label is the one thing a fixture cannot claim without also declaring
      # itself to be the Sentinel, which is the point: impersonating a network
      # identity and claiming to be a workload are different acts and are now
      # expressed by different labels.
      #
      # NOTE: `spec.selector` is IMMUTABLE. Upgrading an existing installation
      # requires deleting the Deployment first. See UPGRADING.md.
      srek3s.io/component: sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srek3s-sentinel
        # Must mirror spec.selector.matchLabels exactly, or the Deployment is
        # rejected with "`selector` does not match template `labels`". Kept
        # adjacent to it for that reason: they are one declaration split in two,
        # and the reason they are split at all is Kubernetes' immutability rule.
        srek3s.io/component: sentinel
        # Explicit, and also supplied by deploy/kustomization.yaml's
        # commonLabels. Written here so the file and the render agree — see the
        # note on the selector in deploy/service.yaml for why that divergence
        # produces a Service with no endpoints rather than an obvious error.
        app.kubernetes.io/part-of: srek3s
      annotations:
        # Roll the pod when the Sentinel's own source changes.
        checksum/sentinel: "replaced-by-pipeline"
        # Prometheus scrape target. The listener is :9090/metrics on its own
        # goroutine, off the emitter path.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: srek3s-sentinel
      # The Sentinel *does* need a token - it is the watcher - unlike the agent.
      # Bound to get/list/watch only by deploy/rbac.yaml.
      automountServiceAccountToken: true

      # ARCH §8: UID/GID 10001. Matches the Dockerfile's USER, so the image's own
      # declaration and the cluster's agree; a mismatch is a pod that starts as one
      # user and writes files as another.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: sentinel
          image: registry.internal/srek3s-sentinel:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9090
          args:
            - -log-level=$(LOG_LEVEL)

          env:
            # Logs to stdout: a read-only root filesystem forbids a log file, and
            # the runtime collects them.
            - name: LOG_LEVEL
              value: info
            # Where to POST incidents. The agent's Service, in-namespace, over
            # plaintext: the network is loopback within the cluster and the
            # payload is already scrubbed in memory on the way out.
            - name: SREK3S_AGENT_URL
              value: http://srek3s-agent:8000
            # Dynamic scrubber manifest. The ConfigMap is mounted at
            # /etc/srek3s; if the file is missing, malformed, or contains an
            # invalid regex the Sentinel panics at boot - a degraded scrubber
            # must never reach a running pod.
            - name: SREK3S_SCRUBBER_MANIFEST
              value: /etc/srek3s/scrubber.json
            # Defaults to THIS namespace, which is the namespace deploy/rbac.yaml
            # actually grants. Secure-by-default: the shipped manifest's watch scope
            # and its read authority now AGREE, so a straight `kubectl apply -k
            # deploy/` produces a working, authorised watcher with no errors in its
            # log — see "WHY THIS IS NOT EMPTY" below for what that changes.
            #
            # WHY THIS IS NOT EMPTY, and what it costs.
            #
            # An empty value means ALL namespaces. Combined with a Role that exists
            # only in srek3s-system, that pairing is incoherent: the informer issues
            # a cluster-wide LIST the apiserver refuses, retries forever, and the
            # operator sees no incidents and no useful error — the confirmed defect in
            # PRD_LIVE_VALIDATION.md §4, reproduced on this cluster before this value
            # was changed:
            #
            #     failed to list *v1.Pod: pods is forbidden: User
            #       "system:serviceaccount:srek3s-system:srek3s-sentinel" cannot list
            #       resource "pods" in API group "" at the cluster scope
            #
            # A previous revision of this comment argued the value should stay empty
            # because narrowing it "would only change WHICH namespace is
            # unauthorised". That was reasoning about the wrong baseline. The
            # alternative to a coherent default was not a working configuration; it
            # was a guaranteed 403 on every LIST.
            #
            # WHAT THIS COSTS, stated plainly: the Sentinel observes only
            # srek3s-system out of the box, so it will NOT report failures in
            # application namespaces until an operator widens it. That is the
            # intended trade — the default is the narrower, authorised one, and
            # widening requires a deliberate act rather than a working accident.
            #
            # TO OBSERVE MORE, do both halves (docs/runbook.md §1 has the commands):
            #
            #   1. set WATCH_NAMESPACE to the namespace you want, AND
            #   2. grant the read verbs THERE, with a RoleBinding referring back to
            #      the ServiceAccount in srek3s-system
            #
            # deploy/overlays/local-live/ is a worked example of exactly that pair.
            # A ClusterRole is NOT the fix and would be the single highest-severity
            # change available to this codebase.
            - name: WATCH_NAMESPACE
              value: srek3s-system
            - name: TMPDIR
              value: /tmp

          # Identical to the agent's, for the same reasons: the Sentinel needs no
          # capabilities, so all are dropped rather than selected.
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL

          # The only writable path. /tmp is required by the Go runtime's
          # os.TempDir callers and by the TLS root-CA cache; a read-only root
          # filesystem otherwise leaves the process unable to resolve a hostname.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: scrubber-manifest
              mountPath: /etc/srek3s
              readOnly: true

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              # No memory limit above the request, for the same reason as the
              # agent: the Sentinel must not be OOMKilled while observing
              # someone else's OOMKill. It is the process most likely to be holding
              # a failure it has not yet shipped.
              memory: "512Mi"
              cpu: "1"
              ephemeral-storage: "128Mi"

          # The Sentinel has no HTTP surface of its own, so there is nothing to
          # probe. Liveness is expressed as a process check instead: if the runtime
          # can exec and the process is scheduled, it is alive. A synthetic HTTP
          # probe would need an endpoint that did not exist, and the usual
          # alternative - a liveness probe against the apiserver - would kill the
          # pod during an apiserver blip, which is precisely when its job matters.
          livenessProbe:
            exec:
              command: ["/bin/sentinel", "-version"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # No readiness probe. The Sentinel has no traffic to shed: it is not
          # behind a Service, and there is no state to declare ready. A readiness
          # probe here would only be a way to remove a working pod from a Service
          # it is not part of.

      # MUST exceed cmd/sentinel's ShutdownGrace (20s), or the kubelet SIGKILLs the
      # process mid-drain and the graceful path is decorative. The invariant is
      # asserted by TestTerminationGraceExceedsTheDrainBudget — a change to one
      # without the other fails the build rather than turning every rolling update
      # into a slow-loss event.
      #
      # POD level, not container level. `terminationGracePeriodSeconds` is a PodSpec
      # field with no container-level counterpart, so at container level the
      # apiserver rejects the whole Deployment with
      # `strict decoding error: unknown field
      #  "spec.template.spec.containers[0].terminationGracePeriodSeconds"`.
      # It shipped that way and no gate caught it, for the same reason as the agent
      # manifest: the drain-budget assertion reads the value as TEXT and cannot
      # distinguish the two levels. Found by applying to a live control plane.
      terminationGracePeriodSeconds: 45

      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: scrubber-manifest
          configMap:
            name: srek3s-scrubber

---
# NetworkPolicy for the Sentinel.
#
# Egress is restricted to the apiserver, the agent, and DNS. The Sentinel has no
# other reason to send a packet, and "no other reason" is enforceable here in a way
# it is not in the code - a compromised process with an unexpected egress would be
# stopped by this rather than trusted not to have one.
#
# ---------------------------------------------------------------------------
# PORTABILITY — READ BEFORE APPLYING TO A DIFFERENT CLUSTER
# ---------------------------------------------------------------------------
# The apiserver-egress rule below permits two DEFAULT SERVICE CIDRs — k3s's
# `10.43.0.0/16` and kubeadm's `10.96.0.0/12` — on port 443. Both are the standard
# values for those distributions, so the shipped manifest works on a stock cluster
# without editing. No node or pod address appears in it: those are per-installation
# facts, and an ephemeral one does not belong in a repository manifest.
#
# If your control plane is reached by an address in neither range — a different
# service CIDR, or a genuinely external apiserver — patch the ipBlock rather than
# editing this file, and derive the value rather than guessing it:
#
#   kubectl -n default get svc kubernetes -o jsonpath='{.spec.clusterIP}'
#
# A stale or wrong range fails EXACTLY as the previous rule did: silently, with zero
# 403s, and with a stats line reading `watcher_emitted: 0`. Treat a changed address
# as a required edit rather than a cosmetic one.
#
# No static test in this repository can validate an address. There is no apiserver
# to ask during `go test`, and a YAML parser can only confirm the document is
# well-formed - which is exactly the limit that let an invalid field sit at the
# wrong nesting level for an entire milestone. The check that matters is
# behavioural: after any change to this rule, confirm the reflector's
# `failed to list *v1.Pod` messages have STOPPED, and that `watcher_emitted` rises
# when a failing pod exists. Absence of 403s proves nothing; a working LIST does.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: srek3s-sentinel
  namespace: srek3s-system
  labels:
    app.kubernetes.io/name: srek3s-sentinel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: srek3s-sentinel
  policyTypes:
    - Egress
    - Ingress
  # No ingress rules: the Sentinel serves nothing but :9090/metrics, and the
  # scrape path stays deny-by-default. An operator who runs Prometheus opens
  # TCP 9090 from their monitoring namespace in their own overlay; the base
  # does not guess where that lives.
  ingress: []
  egress:
    # -------------------------------------------------------------------------
    # THE KUBERNETES API, BY Service CIDR ON 443.
    #
    # This was, until 2026-10-01:
    #
    #     to:
    #       - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
    #         podSelector:       {matchLabels: {component: kube-apiserver}}
    #     ports: [{protocol: TCP, port: 6443}]
    #
    # which is correct ONLY where the apiserver runs as a pod labelled
    # `component=kube-apiserver` inside kube-system - i.e. kubeadm. It matches nothing
    # on k3s, and nothing on EKS, GKE, or any managed control plane where the
    # apiserver is not a selectable pod. On this cluster:
    #
    #     $ kubectl -n kube-system get pods -l component=kube-apiserver
    #     No resources found in kube-system namespace.
    #
    # The failure is the dangerous kind. The reflector's log is unremarkable and
    # periodic:
    #
    #     W reflector.go:561] failed to list *v1.Pod: Get
    #       "https://10.43.0.1:443/api/v1/namespaces/sentinel-chaos/pods?limit=500..."
    #       dial tcp 10.43.0.1:443: connect: connection refused
    #
    # interleaved with healthy counters: {"watcher_emitted":0,"watcher_dropped":0}.
    # There were ZERO 403s, because no authorization was ever attempted. An
    # RBAC-only check reports this deployment healthy while the watcher sees nothing,
    # and a chaos fixture OOM-killing against it yields "no incidents detected",
    # indistinguishable from a quiet cluster. That is precisely the silent failure
    # PRD F4 and the post-remediation loop exist to make visible.
    #
    # A NetworkPolicy `to:` can select a namespace, a set of pods, or an `ipBlock`.
    # The apiserver is a host process behind a Service in every one of these
    # topologies, so `ipBlock` is the only instrument that can express it portably.
    # OPERATOR ACTION: If your API server is external to the Service CIDR, you must
    # patch this ipBlock to include your control-plane endpoints.
    #
    # The two ranges below are the DEFAULT SERVICE CIDRs of the two common
    # distributions, kept deliberately generic:
    #
    #   10.43.0.0/16   k3s
    #   10.96.0.0/12   kubeadm (kind, minikube, EKS, GKE)
    #
    # Both are private RFC1918 space and neither is a workload address, so neither
    # widens what the Sentinel can reach as a workload; what it may DO with what it
    # reads is still bounded by a namespaced Role enumerating
    # ["get","list","watch"].
    #
    # NO NODE IP APPEARS HERE, deliberately. An earlier revision carried this
    # cluster's node endpoint (172.30.181.188/32 on port 6443) so the policy would
    # also cover CNIs that evaluate after DNAT to a node address. That address is
    # ephemeral — WSL reassigns it across reboots — so committing it would have
    # shipped a repository manifest that silently stops matching on the next boot,
    # failing in exactly the way this rule was written to eliminate: the reflector
    # logs `failed to list *v1.Pod`, the stats line reads `watcher_emitted: 0`, and
    # there are ZERO 403s because no authorization is ever attempted.
    #
    # The rule that actually holds across reboots is the Service CIDR on 443, since
    # in-cluster client config always addresses `kubernetes.default.svc`. A cluster
    # that needs the node endpoint is a cluster whose operator should say so in
    # their own overlay — where an ephemeral address belongs, and where the
    # derivation step is documented rather than forgotten.
    #
    # VERIFY AFTER ANY CHANGE: the check that matters is behavioural, not static. No
    # test in this repository can ask an apiserver whether egress works, and a YAML
    # parser can only confirm the document is well-formed. Confirm the reflector's
    # `failed to list *v1.Pod` messages have STOPPED and that `watcher_emitted` rises
    # when a failing pod exists. Absence of 403s proves nothing; a working LIST does.
    # -------------------------------------------------------------------------
    - to:
        - ipBlock:
            cidr: 10.43.0.0/16
        - ipBlock:
            cidr: 10.96.0.0/12
      ports:
        - protocol: TCP
          port: 443
    # The agent, for POST /v1/incidents.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: srek3s-agent
      ports:
        - protocol: TCP
          port: 8000
    # DNS, to resolve both of the above by name.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
