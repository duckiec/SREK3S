# SREK3S Triage Agent - Kubernetes deployment.
#
# ROADMAP 2.7.3. AGENTS.md §2 and ARCHITECTURE.md §8 require a hardened runtime:
# non-root UID/GID 10001, a read-only root filesystem, all Linux capabilities
# dropped, and no privilege escalation. The image itself is hardened in
# agent/Dockerfile; this manifest is where the *cluster* half of that is
# enforced, because a Dockerfile cannot express seccomp or a read-only mount.
#
# The container build gate in CI asserts the effective uid is 10001 at runtime, so
# a Dockerfile edit that dropped USER would fail the build rather than deploy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srek3s-agent
  namespace: srek3s-system
  labels:
    app.kubernetes.io/name: srek3s-agent
    app.kubernetes.io/part-of: srek3s
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: srek3s-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srek3s-agent
        # Explicit, and also supplied by deploy/kustomization.yaml's
        # commonLabels. Writing it here makes this file agree with the render.
        # The Service in deploy/service.yaml selects on it, so if it were present
        # only via commonLabels the two apply paths would produce different
        # selectors — and applying agent.yaml directly, then the overlay, leaves
        # the Service selecting on a label these pods do not carry. See
        # deploy/service.yaml for what that costs: no endpoints, Errno 111, and
        # a healthy agent that looks like a refused connection.
        app.kubernetes.io/part-of: srek3s
      annotations:
        # Roll the pods when the agent's own source changes.
        checksum/agent: "replaced-by-pipeline"
    spec:
      # AGENTS.md §2: UID/GID 10001, matching agent/Dockerfile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # The agent holds no cluster credential and needs no Kubernetes API access.
      # I-B5 is that no artefact can express a write verb; giving the agent no
      # token at all is the stronger version of the same property - it cannot
      # write to the cluster even if a future bug tried to.
      automountServiceAccountToken: false

      containers:
        - name: agent
          image: registry.internal/srek3s-agent:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000

          env:
            # ARCH §8: logs to stdout because a read-only root filesystem forbids
            # a log file. The runtime collects them.
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            # A read-only root filesystem cannot write __pycache__, and without
            # this the interpreter fails at import time rather than degrading.
            - name: TMPDIR
              value: /tmp
            # ROADMAP 2.2.5: the active-job budget. Sized for the deterministic
            # Milestone 2 analysis, which is CPU-trivial, so this bounds blast
            # radius rather than CPU saturation. Deliberately small: a large value
            # would let one noisy namespace consume the agent while the budget was
            # nominally "not reached".
            - name: SREK3S_MAX_ACTIVE_JOBS
              value: "4"
            - name: SREK3S_LOG_LEVEL
              value: INFO
            # The agent's GitOps target root. Points at the `manifests` volume
            # mounted above.
            #
            # READ THIS BEFORE ENABLING TIER-1. The volume ships as an emptyDir,
            # so as deployed this directory is empty and the manifest provider
            # cannot resolve a target file. Every incident therefore escalates to
            # Tier-2 under I-B2, and no patch is ever proposed unverified. That is
            # the intended safe state, not a misconfiguration - but it looks
            # exactly like a working setup, so it is stated here rather than left
            # to be discovered.
            #
            # To produce Tier-1 patches, populate this root with the checkout
            # your GitOps pipeline actually applies (see the volume's comment),
            # and set SREK3S_TARGET_MANIFEST to a repo-relative path inside it.
            # Until then, expect 100% Tier-2 and treat that as the design working,
            # not as the agent failing.
            - name: SREK3S_MANIFEST_ROOT
              value: /manifests

            # -------------------------------------------------------------------------
            # MODEL TRANSPORT SELECTION (ARCH §5.5.4)
            #
            # The model is advisory: it can only write the prose in a Tier-2
            # explanation a human already has to read. Tier, patch and every
            # validation flag are computed deterministically and are unaffected
            # by anything below.
            #
            # `LLM_PROVIDER` picks the transport and defaults to `gemini`, which
            # is the behaviour that shipped before the abstraction existed —
            # an operator who changes nothing sees nothing change.
            #
            # `LLM_BASE_URL` repoints the OpenAI-protocol adapter at a self-hosted
            # server, e.g. `http://ollama.srek3s-system.svc:11434/v1` or a vLLM
            # endpoint. THIS IS NOT WIRE-THROUGH BY DEFAULT: the NetworkPolicy at
            # the bottom of this file permits egress on TCP 443 to 0.0.0.0/0 and
            # nothing else, so a local server on Ollama's default 11434 or vLLM's
            # 8000 is refused by the network, not by this code. Widening that rule
            # is an egress decision with a real blast radius, so it is stated here
            # rather than made silently. An empty value means "the provider's own
            # default endpoint" and is the correct setting for a hosted API.
            #
            # No key is required for a local endpoint. One IS required for a
            # hosted one, and `provider_from_env()` returns nothing without it,
            # which degrades the narrative and never the service.
            # -------------------------------------------------------------------------
            - name: LLM_PROVIDER
              value: gemini
            - name: LLM_BASE_URL
              value: ""

            # -------------------------------------------------------------------------
            # GEMINI_API_KEY — THE MODEL CREDENTIAL
            #
            # Read from a Secret, never from a literal. A value in this file would be
            # a committed credential in every clone and every image layer, and would
            # be readable by anyone with `kubectl get deployment -o yaml` — which the
            # Role in deploy/rbac.yaml does NOT grant, so the manifest route is the
            # one that matters here.
            #
            # `optional: true` IS THE IMPORTANT PART, and it is not laziness. Without
            # it, a cluster with no `srek3s-secrets` Secret produces a pod stuck in
            # `CreateContainerConfigError`, because a missing keyRef is a hard
            # admission failure — NOT a missing environment variable. That would mean
            # an operator who wants no model at all cannot run the agent, which is
            # the wrong default: the deterministic path is complete and needs no
            # credential. With `optional: true` an absent Secret leaves the variable
            # unset, `providers.provider_from_env()` returns None, and every tier,
            # patch and validation flag behaves exactly as it did before this existed.
            #
            # `OPENAI_API_KEY` is the same idea for the OpenAI-protocol adapter and
            # belongs in this same Secret when that provider is selected. It is not
            # declared here because an operator using `LLM_PROVIDER=openai` adds
            # the reference in the same commit that changes the provider, so the
            # two settings can never disagree silently.
            #
            # CREATE THE SECRET (it is deliberately NOT in this repository):
            #
            #   kubectl -n srek3s-system create secret generic srek3s-secrets \
            #     --from-literal=GEMINI_API_KEY="$(grep -oP '(?<=^GEMINI_API_KEY=).*' .env.local)"
            #
            # The read touches a credential, so the value is never echoed. Confirm
            # presence without printing it:
            #
            #   kubectl -n srek3s-system get secret srek3s-secrets \
            #     -o jsonpath='{.data.GEMINI_API_KEY}' | wc -c   # non-zero = present
            #
            # WHY A SINGLE-KEY SECRET NAMED `srek3s-secrets` RATHER THAN A KEY PER
            # COMPONENT: it is one credential, and a per-component name would imply
            # more than exists. `srek3s-secrets` also leaves room for the others this
            # system will eventually need without renaming this mount.
            # -------------------------------------------------------------------------
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: srek3s-secrets
                  key: GEMINI_API_KEY
                  optional: true

          # ARCH §8: read-only root, no privilege escalation, every capability
          # dropped. The agent needs none of them, so all are dropped rather than
          # selected - an allow-list here would be a list to forget an entry on.
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL

          # The only writable path. /tmp is required because a read-only root
          # filesystem leaves the interpreter nowhere to put a temporary file,
          # and the sandbox and the I-B2 git check both create one.
          #
          # /manifests is read-only to the agent. It is the agent's GitOps target
          # root, and a triage path that could rewrite the manifest it is about to
          # propose a diff against could make that diff apply to something other
          # than what it was derived from - which is the failure I-B2 exists to
          # prevent, reached from the other direction.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: manifests
              mountPath: /manifests
              readOnly: true

          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              # No memory limit above the request: this agent must not be OOMKilled
              # while triaging someone else's OOMKill. A CPU limit is set, because
              # an unbounded CPU spin is a real failure mode here.
              cpu: "1"
              ephemeral-storage: "128Mi"

          # A deliberately generous probe budget. The triage path is
          # sub-millisecond, so a probe that failed would mean the *process* is
          # unhealthy, not busy - and probes are exempt from the job budget, so
          # load never causes this to trip.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

      # Long enough for an in-flight triage to finish and be reaped. Shorter than
      # this and a legitimate request would be killed mid-analysis.
      #
      # POD level, not container level, and that distinction is not cosmetic.
      # `terminationGracePeriodSeconds` is a field of PodSpec and has no
      # container-level counterpart, so placing it inside the container list makes
      # the apiserver reject the entire Deployment:
      #
      #     strict decoding error: unknown field
      #     "spec.template.spec.containers[0].terminationGracePeriodSeconds"
      #
      # This shipped in the committed manifest and was never caught by a gate,
      # because the drain-budget assertion reads the value as TEXT. A grep finds
      # "terminationGracePeriodSeconds: 30" equally well at either indentation, so
      # the test passed against a manifest the API server would not accept. It was
      # found here only by applying to a live control plane — the failure mode
      # `AGENTS.md` §5.7 describes as the cheapest one available: a check that is
      # satisfied by a document's content without regard to whether the document is
      # valid.
      terminationGracePeriodSeconds: 30

      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        # The agent's GitOps target root. See the SREK3S_MANIFEST_ROOT note below:
        # this ships EMPTY, and that is deliberate.
        #
        # An emptyDir is the right default for a mount whose contents are an
        # operator's choice, and it is the fail-closed choice as well - an empty
        # root means the manifest provider cannot resolve the target file, so
        # every incident escalates to Tier-2 under I-B2 and no patch is ever
        # proposed unverified. That is the same outcome as leaving
        # SREK3S_MANIFEST_ROOT unset, which is what the code did until this
        # mount existed.
        #
        # What it is NOT is a working GitOps checkout. To enable Tier-1, replace
        # this volume with the real checkout - a PersistentVolumeClaim, or an
        # init container that clones the repository - and set
        # SREK3S_TARGET_MANIFEST to a path within it. The runbook says so in the
        # same words, because a mount that exists and is empty is exactly the
        # kind of thing an operator reads as "already configured".
        #
        # medium: Memory is deliberately NOT used here, unlike /tmp. This holds
        # manifests that are read on the triage path; tmpfs counts against the
        # container's memory limit, and a large checkout would then be a
        # foot-gun that OOMs the agent while triaging someone else's OOMKill.
        - name: manifests
          emptyDir:
            sizeLimit: 256Mi

---
# NetworkPolicy: the agent's only permitted egress is the Sentinel's model call.
#
# Egress is restricted rather than open because the agent is the exit path for
# scrubbed incident data. ROADMAP 2.4.5 requires the investigation sandbox hold no
# egress beyond the one authorised model call; this is where that is enforced at
# the network layer rather than trusted to the code.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: srek3s-agent-egress
  namespace: srek3s-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: srek3s-agent
  policyTypes:
    - Egress
    - Ingress
  ingress:
    # Only the Sentinel may reach the triage endpoint.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: srek3s-sentinel
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # -------------------------------------------------------------------------
    # DNS, to resolve the model endpoint by name.
    # -------------------------------------------------------------------------
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # -------------------------------------------------------------------------
    # THE MODEL ENDPOINT, ON 443.
    #
    # This rule was added 2026-10-01, and it is the first and only rule that lets
    # this pod reach anything outside the cluster. Until it existed, the agent had
    # NO egress but DNS, which is the correct default and is still the shape of
    # every other rule here. It also meant a configured Gemini client could not
    # work: with the key mounted, the pod failed every completion with
    #
    #     OSError: [Errno 101] Network is unreachable
    #
    # and degraded silently to the deterministic RCA. That is the exact failure
    # this repository exists to prevent wearing a green log: the agent looked
    # healthy, /readyz answered 200, and every incident produced a plausible
    # analysis that no model had contributed to.
    #
    # WHY `0.0.0.0/0` AND NOT A NARROWER BLOCK, because the narrower option does
    # not exist here. A NetworkPolicy `to:` can select a namespace, a set of pods,
    # or an `ipBlock` — and an ipBlock is CIDR, not a hostname. Google's endpoint
    # resolves to a large, geographically varying, Anycast-advertised set of
    # addresses with no stable CIDR an operator can write down:
    #
    #     $ getent hosts generativelanguage.googleapis.com
    #     172.217.114.4        # and 34.x, 35.x, 142.250.x, 2607.f8b0:... on other queries
    #
    # So the honest options were (a) a hand-maintained list that silently stops
    # matching when Google re-announces, reproducing precisely the "ephemeral
    # address in a committed manifest" defect that `deploy/sentinel.yaml` was
    # rewritten to eliminate, or (b) 443 to anywhere. (b) is chosen, and its cost
    # is stated plainly: **this pod can open a TLS connection to any host on 443**.
    #
    # WHAT THAT COST IS AND IS NOT. It is not unrestricted egress — the port is
    # fixed at 443, and UDP/TCP 53 to anywhere else is still refused. It is not an
    # exfiltration path for cluster secrets, because the agent holds no cluster
    # credential at all (`automountServiceAccountToken: false`) and its only input
    # is scrubbed telemetry. It does mean a hypothetical code-execution bug in the
    # agent could reach an arbitrary HTTPS endpoint.
    #
    # THE TIGHTER ALTERNATIVE, if this ever matters: a DNS-based egress gateway, or
    # a CNI with FQDN policy support (Cilium), which expresses "generativelanguage.
    # googleapis.com:443" directly. Neither is available on this cluster's default
    # dataplane, so neither is shipped as the only working path.
    #
    # NOTE the contrast with `deploy/sentinel.yaml`, which reaches the apiserver by
    # `ipBlock` on the Service CIDR. That one CAN be narrow, because the apiserver
    # is a known address inside the cluster. An external provider is not.
    # -------------------------------------------------------------------------
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
