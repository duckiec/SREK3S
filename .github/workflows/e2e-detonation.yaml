name: e2e-detonation

# Milestone 4: the full pipeline against a real cluster.
#
# Why this exists and why it is separate from ci.yaml
# --------------------------------------------------
# `ci.yaml` proves the units are correct. This proves they are *connected*: that a
# container which really OOMs produces a real incident, that its logs are really
# fetched, that the credentials planted in those logs really are masked, that the
# agent really triages it, and that the patch really applies with `git apply`.
#
# Every one of those claims was unproven until Milestone 4 pre-flight, and the
# pre-flight found two things the unit tests could not:
#
#   * `-namespace` was decorative. The flag was read and logged over an informer
#     that watched every namespace, so the startup log asserted a scoping that was
#     not in effect. Nothing failed.
#   * every Tier-1 patch was unapplyable, because `build_diff` omitted the trailing
#     newline and `git_apply_check` appended it before verifying. The gate
#     reported `patch_validated: True` for a patch no pipeline would accept.
#
# Neither was reachable from a unit test. Both are exactly the class of defect this
# workflow exists to catch, which is the argument for it being a gate rather than a
# convenience.
#
# What this workflow cannot prove is stated in the ROADMAP: it runs the `-race`
# authority gate (3.7.3) and exercises the live path, but the offline image import
# (3.6.6) needs a target with a populated containerd namespace and is verified
# against a real k3s node rather than by this job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      observation_window:
        description: "Seconds to sample the crashing pod (CrashLoopBackOff is unobservable before ~12s)"
        required: false
        default: "90"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.23"
  PYTHON_VERSION: "3.11"
  # Overridable per run because the honest floor is a property of the kubelet's
  # backoff, not a taste: the first failure restarts immediately (no backoff entry
  # exists yet) and CrashLoopBackOff is published only from the second, so nothing
  # is observable before ~10s. 90s leaves room for the two backoff intervals the
  # runner samples across.
  OBSERVATION_WINDOW: ${{ github.event.inputs.observation_window || '90' }}
  # The disposable fixture namespace (ROADMAP 4.1.1). Nothing in srek3s-system
  # references it, so it is safe to create and safe to delete.
  CHAOS_NAMESPACE: sentinel-chaos
  # busybox is pinned and imported rather than pulled: the fixtures use
  # `imagePullPolicy: Never`, so a missing image is a hard apply failure rather
  # than a slow pull. Pinned so the fixture's behaviour is not a function of a
  # floating tag.
  BUSYBOX_IMAGE: busybox:1.36.1

jobs:
  detonation:
    name: E2E detonation (k3s, real OOM, real patch)
    runs-on: ubuntu-latest
    # Generous, because the observation window alone is 90s and cluster startup on
    # a shared runner is not fast. A timeout here is indistinguishable from a
    # hang, so it is set well above the expected runtime rather than close to it.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Full history. `git apply --check` and the agent's I-B2 verification both
        # initialise throwaway repositories, and a shallow clone changes what
        # `git init` can see about the parent - which is a difference between this
        # job and the one the P0 was found on, and a difference is not something
        # to discover mid-run.
        with:
          fetch-depth: 0

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install agent dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      # ---------------------------------------------------------------
      # 3. The pending M3 authority gate.
      #
      # This is ROADMAP 3.7.3, unticked for two milestones because the race
      # detector has no ThreadSanitizer for windows/arm64, the development host.
      # ubuntu-latest is the sole authority (ARCH AD-10), and this is that
      # authority. It runs *before* the cluster is created so a compile or race
      # failure costs seconds rather than a cluster teardown.
      # ---------------------------------------------------------------
      - name: M3 authority gate — go test -race
        run: go test -v -race -timeout 30s ./...

      - name: M3 terminal validation
        timeout-minutes: 10
        run: |
          set -euo pipefail
          go test -race -timeout 30s \
            -run 'TestNilPointerSafety|TestNoGoroutineLeak|TestIncidentPayloadContract' \
            -v ./...

      - name: Build the sentinel binary
        run: |
          go build -o bin/sentinel ./cmd/sentinel
          ./bin/sentinel -version

      # ---------------------------------------------------------------
      # OFFLINE GATE. No cluster, no network, a few seconds.
      #
      # This is the check whose absence let the P0 ship: it asks real `git` about a
      # diff the *generator* actually produced, which no unit test did, because
      # every earlier check either used a hand-written diff or went through
      # `git_apply_check` - and that checker repaired its input before verifying.
      #
      # Placed here, before k3s, on purpose. It needs nothing from the cluster, so
      # running it first means a regression in the patch path costs seconds and
      # fails with a legible message, instead of after a 21-step cluster bring-up
      # that then reports a patch error at the far end.
      # ---------------------------------------------------------------
      - name: Offline gate — generate a patch and verify it with real git
        timeout-minutes: 5
        run: |
          set -euo pipefail
          PYTHONUNBUFFERED=1 python tests/e2e/verify_patch.py \
            --manifest tests/fixtures/oom-restartloop.yaml \
            --path deploy/payments/checkout-api.yaml \
            --container checkout-api \
            --from-limit 256Mi --to-limit 512Mi

      # ---------------------------------------------------------------
      # 4. A lightweight local cluster.
      #
      # k3s rather than kind: kind needs a Docker daemon and this runner's is
      # shared, while the k3s install script brings up an embedded etcd-backed
      # apiserver with containerd already wired the way the fixtures assume. The
      # fixtures also use `imagePullPolicy: Never`, which means the next step's
      # import is not an optimisation but a requirement.
      # ---------------------------------------------------------------
      - name: Install k3s
        # Bounded twice over: the step has a wall-clock budget, and the download
        # has its own. A step timeout alone would leave a half-written k3s binary
        # and a runner that looks busy.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # `curl ... | sh -` without pipefail is a silent-success trap: a failed
          # download pipes an empty body to `sh`, which exits 0, the step reports
          # green, and every later step then fails against a cluster that was
          # never installed. The default Actions shell sets -e but NOT pipefail,
          # so this has to be explicit.
          #
          # INSTALL_K3S_EXEC is set because of a real defect found on the first
          # remote run: k3s writes /etc/rancher/k3s/k3s.yaml mode 0600 owned by
          # root, and the Actions shell runs as `runner`. Every subsequent kubectl
          # call would then fail with "permission denied" on the kubeconfig - a
          # failure that reads as a cluster problem and is not one. 644 is the
          # documented remedy and is safe here: the file is inside an ephemeral
          # runner VM that is destroyed when the job ends.
          curl -fsSL --retry 3 --retry-delay 2 --max-time 300 \
            https://get.k3s.io \
            | INSTALL_K3S_VERSION=v1.29.9+k3s1 \
              INSTALL_K3S_EXEC="server --write-kubeconfig-mode 644" sh -
          echo "KUBECONFIG=/etc/rancher/k3s/k3s.yaml" >> "$GITHUB_ENV"

          # Client-only checks, deliberately. `kubectl version` *without* --client
          # contacts the apiserver, and this step runs before the readiness wait,
          # so it raced the very thing the next step waits for. That was a
          # regression introduced by the pre-push audit, which added `set -e` and in
          # the same edit removed the `||` fallback that had been hiding it.
          # The server-contacting check now lives in the readiness step, after the
          # cluster is provably up, and `scripts/audit_workflow.py` asserts that
          # ordering rather than trusting the comment above.
          k3s --version
          kubectl version --client=true

      - name: Wait for the API server
        timeout-minutes: 5
        run: |
          set -uo pipefail
          for i in $(seq 1 90); do
            if kubectl get --raw /readyz >/dev/null 2>&1; then
              echo "apiserver ready after ${i}s"
              # The server-contacting version check, and deliberately here rather
              # than in the install step: this is the first point at which the
              # cluster is provably up, so this is the first point at which
              # `kubectl version` without --client is meaningful. It also proves
              # the kubeconfig is readable as the unprivileged `runner` user, which
              # is the symptom of a missing --write-kubeconfig-mode and is cheaper
              # to diagnose here than three steps downstream.
              kubectl version
              kubectl get nodes -o wide
              exit 0
            fi
            sleep 1
          done
          echo "::error::apiserver did not become ready within 90s"
          kubectl get pods -A || true
          exit 1

      # ---------------------------------------------------------------
      # 5. Get busybox into the k3s containerd namespace.
      #
      # Native `k3s ctr`, no Docker. The previous revision pulled with `docker
      # pull` and `docker save` and imported the archive; that path failed on
      # ubuntu-latest at the `docker pull`, and the registry was not the cause -
      # the mirror manifest answers 200 from outside. The remaining candidate was
      # the Docker daemon itself, and removing it removes the question along with
      # a whole runtime from the critical path: no daemon to be unavailable, no
      # save-then-reimport round trip, and no host-daemon -> containerd translation
      # that could put the image somewhere the kubelet does not read.
      #
      # Split into named steps for the same reason as the previous revision: CI
      # logs return 403 without admin rights, so a step's name is the finest
      # diagnostic a reviewer has. Three steps, and the failing one says which
      # half broke.
      # ---------------------------------------------------------------
      - name: Verify k3s containerd socket access
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # `sudo` is mandatory, not stylistic: /run/k3s/containerd/containerd.sock
          # is root-only, so an unprivileged `k3s ctr` cannot reach the daemon the
          # kubelet reads from. This step exists so that failure is named here
          # rather than surfacing as a confusing error two steps later.
          sudo k3s ctr version
          echo "containerd socket reachable as $(id -un) via sudo"

      # ---------------------------------------------------------------
      # 5b. Pull busybox, and split from tagging so a failure names itself.
      #
      # History, because the reasoning here is not obvious from the code.
      # This step passed once (run 36641223509, sha 2d1f968) and then failed
      # twice with byte-identical code (36642545390, 36643340284). The first
      # failure had no retry loop at all and the second had one, so "the pull
      # is flaky and needs retrying" is refuted by the data: the second run
      # had a single attempt and the third had six, and neither passed.
      #
      # The real defect is that `ctr`'s global --timeout flag DEFAULTS TO 0,
      # which means wait-forever. A stalled TCP connection to the registry
      # therefore blocks until the step's own timeout-minutes kills the
      # process, and GitHub reports a killed step with conclusion=failure -
      # byte-identical to a pull that returned an error. Both failures are
      # consistent with a hang, and a hang is invisible without logs.
      #
      # A retry loop cannot fix an unbounded wait: every attempt inherits the
      # same wait and the step timeout kills the process partway through the
      # first one. Bounding each attempt is what converts a hang into a
      # retryable failure. The budget below is chosen to fit:
      #   30s gate + 4 x 60s attempts + 3+6+9s backoff = 228s, against 600s.
      # Six attempts at 90s would be 615s and would not fit - the previous
      # revision's loop was arithmetically incapable of completing.
      # ---------------------------------------------------------------
      - name: Pull Busybox into k3s containerd
        timeout-minutes: 15
        run: |
          set -euo pipefail

          # Wait for containerd's image service specifically, not just its
          # socket. `ctr version` succeeding proves the daemon process is up,
          # which is not the same as its content and image stores being
          # initialised - the same shape as the M3 namespace-scoping defect,
          # a precondition satisfied by the wrong check.
          echo "Waiting for containerd image service..."
          ready=0
          for i in $(seq 1 20); do
            if sudo k3s ctr --timeout 5s --namespace k8s.io images list \
                 >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::containerd image service did not become ready in 20 attempts"
            exit 1
          fi
          echo "containerd image service is ready."

          # --timeout 60s on EVERY attempt. This is the load-bearing flag. It
          # is a global ctr flag, before the subcommand, exactly like
          # --namespace, and its default of 0 means "no timeout" rather than
          # "instant". Without it a single stalled connection consumes the
          # entire step budget and no retry can be reached.
          ATTEMPT=60s

          # Two registries, and the zero-auth one is tried first.
          #
          # public.ecr.aws requires a token dance: manifest GET returns 401
          # with a WWW-Authenticate challenge, then a second request to the
          # token endpoint, then the manifest. That is three round trips and
          # three places to fail, on the critical path of a step that is
          # already the slowest thing in the workflow.
          #
          # mirror.gcr.io answers the manifest directly with 200 and no
          # authentication at all. Both were verified reachable from outside
          # before being written here. Order is not cosmetic: the first entry
          # is the one that usually succeeds, and if it is the one that hangs
          # the bounded timeout moves us to the second rather than to a step
          # failure.
          REF=""
          for candidate in \
            "mirror.gcr.io/library/busybox:1.36.1" \
            "public.ecr.aws/docker/library/busybox:1.36.1"; do
            for attempt in 1 2 3; do
              echo "pull attempt $attempt: $candidate (timeout $ATTEMPT)"
              if sudo k3s ctr --timeout "$ATTEMPT" --namespace k8s.io \
                   images pull "$candidate"; then
                REF="$candidate"
                break 2
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "  attempt $attempt failed; sleeping $((attempt * 3))s"
                sleep $((attempt * 3))
              fi
            done
            echo "  giving up on $candidate"
          done
          if [ -z "$REF" ]; then
            echo "::error::could not pull busybox from either registry"
            exit 1
          fi
          echo "pulled $REF"

          # --namespace k8s.io, not ctr's default `default`. The kubelet reads
          # k8s.io, so an image in `default` is present and invisible: every
          # fixture pod would report ImagePullBackOff on a cluster that
          # demonstrably has the image. `k3s ctr` overrides the socket address
          # and nothing else, so it does not change this default.
          sudo k3s ctr --timeout 30s --namespace k8s.io images tag \
            "$REF" docker.io/library/busybox:1.36.1
          sudo k3s ctr --timeout 30s --namespace k8s.io images tag \
            "$REF" busybox:1.36.1

      - name: Verify k3s Image Registration
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # The output is captured FIRST and matched from the variable, with no
          # pipe. `producer | grep -q` is a race: grep -q exits the moment it
          # finds a match and closes the read end, the writer takes SIGPIPE and
          # dies with status 141, and `set -o pipefail` hands that 141 to the
          # pipeline - so the `||` branch fires and a *passing* check reports
          # failure. Measured on this host: 60 failures in 60 runs piped, 0 in 60
          # with the output captured first. Six of these assertions used that
          # form; all six are now unpiped.
          list=$(sudo k3s ctr --timeout 30s --namespace k8s.io images list) || {
            echo "::error::could not list images in the k8s.io namespace"
            exit 1
          }
          # Same namespace the pull wrote to. Namespace and reference name are
          # both checked because either one wrong produces the identical
          # symptom - ImagePullBackOff - from a different cause.
          grep -q busybox <<<"$list" || {
            echo "::error::busybox is not present in the k8s.io namespace"
            echo "$list"
            echo "--- is it in the default namespace instead? ---"
            sudo k3s ctr images list | grep busybox || true
            exit 1
          }
          # -F: the reference is a literal, and the dots in `docker.io` are not
          # a pattern to be interpreted.
          grep -qF 'docker.io/library/busybox:1.36.1' <<<"$list" || {
            echo "::error::busybox did not register as docker.io/library/busybox:1.36.1; the fixtures will report ImagePullBackOff"
            grep -i busybox <<<"$list" || true
            exit 1
          }
          echo "busybox registered in k8s.io under the name the fixtures reference"

      # ---------------------------------------------------------------
      # 6. The disposable namespace, and its PSA enforcement.
      # ---------------------------------------------------------------
      - name: Apply the chaos namespace (ROADMAP 4.1.1)
        run: |
          kubectl apply -f deploy/chaos/namespace.yaml
          kubectl get namespace "$CHAOS_NAMESPACE" --show-labels

      # ---------------------------------------------------------------
      # 6. Assert Pod Security Admission is enforcing restricted.
      #
      # One step per label, and this is not tidiness. The previous version read
      # `.metadata.labels` through jsonpath and matched it with a shell `case`
      # glob; it failed, and with CI logs returning 403 there was no way to see
      # whether the label was absent or merely formatted differently from what the
      # glob expected. One step per label makes the failing step's *name* the
      # diagnosis, which is the finest signal a reviewer has without logs.
      #
      # The previous assertion also could not distinguish a `kubectl get` that
      # returned nothing from a `kubectl get` that returned something unexpected,
      # because both produced an empty match set. The dump step below exists to
      # separate those two cases in the log on the next run.
      # ---------------------------------------------------------------
      - name: Dump Namespace Labels
        timeout-minutes: 5
        # No `set -e`: this is a diagnostic, and a diagnostic that can fail the
        # job is not a diagnostic. Its output is what makes the next failure
        # readable.
        run: |
          set -uo pipefail
          echo "=== namespace labels as the apiserver serves them ==="
          kubectl get ns "$CHAOS_NAMESPACE" -o yaml | grep -A 8 'labels:' || {
            echo "::warning::no labels block matched the grep; the namespace may "\
                  "not exist under the name $CHAOS_NAMESPACE"
            kubectl get ns -o wide || true
          }

      - name: "Assert PSA enforce=restricted"
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Captured first, matched from the variable, no pipe. `kubectl |
          # grep -q` is a SIGPIPE race under `set -o pipefail`: grep exits at
          # the match, kubectl dies with 141, and the pipeline reports failure
          # on a check that passed. Measured here at 60/60 piped versus 0/60
          # unpiped. See the image-registration step for the full account.
          ns=$(kubectl get ns "$CHAOS_NAMESPACE" -o yaml) || {
            echo "::error::could not read namespace $CHAOS_NAMESPACE"
            exit 1
          }
          grep -q 'pod-security\.kubernetes\.io/enforce: restricted' <<<"$ns" || {
            echo "::error::pod-security.kubernetes.io/enforce is not restricted; a chaos pod could be admitted privileged"
            grep -A 8 'labels:' <<<"$ns" || true
            exit 1
          }
          echo "  ok: enforce=restricted"

      - name: "Assert PSA enforce-version=latest"
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Deliberately a distinct key from `enforce`. grep is a substring match,
          # so an assertion written as `enforce` alone would also be satisfied by
          # `enforce-version` appearing with any value - the check would pass on a
          # namespace that had not opted into a version at all. The backslash in the
          # pattern anchors the `.` characters as literals.
          ns=$(kubectl get ns "$CHAOS_NAMESPACE" -o yaml) || {
            echo "::error::could not read namespace $CHAOS_NAMESPACE"
            exit 1
          }
          grep -q 'pod-security\.kubernetes\.io/enforce-version: latest' <<<"$ns" || {
            echo "::error::pod-security.kubernetes.io/enforce-version is not latest; PSA would evaluate against an unpinned version"
            grep -A 8 'labels:' <<<"$ns" || true
            exit 1
          }
          echo "  ok: enforce-version=latest"

      - name: "Assert PSA audit=restricted"
        timeout-minutes: 5
        run: |
          set -euo pipefail
          ns=$(kubectl get ns "$CHAOS_NAMESPACE" -o yaml) || {
            echo "::error::could not read namespace $CHAOS_NAMESPACE"
            exit 1
          }
          grep -q 'pod-security\.kubernetes\.io/audit: restricted' <<<"$ns" || {
            echo "::error::pod-security.kubernetes.io/audit is not restricted; a violation would leave no record"
            exit 1
          }
          echo "  ok: audit=restricted"

      - name: "Assert PSA warn=restricted"
        timeout-minutes: 5
        run: |
          set -euo pipefail
          ns=$(kubectl get ns "$CHAOS_NAMESPACE" -o yaml) || {
            echo "::error::could not read namespace $CHAOS_NAMESPACE"
            exit 1
          }
          grep -q 'pod-security\.kubernetes\.io/warn: restricted' <<<"$ns" || {
            echo "::error::pod-security.kubernetes.io/warn is not restricted; a violation would pass unannounced"
            exit 1
          }
          echo "  ok: warn=restricted"

      # ---------------------------------------------------------------
      # 7. The triage agent, with the sandbox on.
      #
      # SREK3S_SANDBOX=1 is required, not optional. The I-B2 verification runs
      # `git apply --check` in a throwaway repository, which is a subprocess; with
      # the sandbox off that check may be skipped, and the whole point of this
      # job is to prove the patch is verified.
      #
      # The agent logs "manifest_provider=unreadable" at startup and still returns
      # Tier-1 when a provider is supplied in-process. Over HTTP it will escalate,
      # because `create_app` takes no provider - a known gap recorded in the
      # pre-flight report. The workflow therefore asserts the *patch* separately,
      # in-process, where a provider can be injected. Both are checked; neither is
      # assumed to cover the other.
      # ---------------------------------------------------------------
      # ---------------------------------------------------------------
      # 7. The pre-flight cluster snapshot (ROADMAP 4.2.8).
      #
      # Taken by the runner's OWN --snapshot-out, not by a `kubectl get ... -o
      # yaml` redirect. Two reasons, both mechanical:
      #
      #  * --snapshot-out is a separate exit path that writes the runner's
      #    snapshot schema and returns immediately, which is what enforces that
      #    the before-image predates the components under test.
      #  * snapshot_cluster() records generation and resourceVersion keyed by
      #    apiVersion/kind/namespace/name. Raw kubectl YAML is a different shape,
      #    and _load_snapshot would reject it as corrupt - which it would be
      #    right to do.
      #
      # Its own help text says: "Must be written by --snapshot-out, in a step
      # that predates the component under test."
      #
      # SNAPSHOT_KINDS is the workload kinds, not `all` plus RBAC: the comparison
      # ignores the chaos and system namespaces and needs the objects a
      # remediation could plausibly change.
      #
      # The selector is passed and is not used. `main` declares it as a required
      # positional, so argparse rejects the invocation before the --snapshot-out
      # exit path is ever reached - which is what run on 3966578 did, exiting 2
      # with "the following arguments are required: selector".
      #
      # It is passed rather than made optional because that is a change to
      # runner.py, and the workflow is what this commit was scoped to. Worth
      # naming as a design point rather than leaving as a trap: a required
      # positional that the snapshot path never reads will be forgotten again by
      # whoever writes the next snapshot invocation.
      # ---------------------------------------------------------------
      - name: Take Pre-Flight Cluster Snapshot
        timeout-minutes: 5
        run: |
          set -euo pipefail
          PYTHONUNBUFFERED=1 python tests/e2e/runner.py 'srek3s.io/chaos=oom' \
            --snapshot-out /tmp/snapshot-before.yaml
          if [ ! -s /tmp/snapshot-before.yaml ]; then
            echo "::error::the pre-flight snapshot is empty. An empty before-image"
            echo "::error::compared against an empty after-image passes every"
            echo "::error::no-mutation assertion while proving nothing."
            exit 1
          fi
          echo "snapshot: $(grep -c '"resourceVersion"' /tmp/snapshot-before.yaml) objects"

      - name: Start the triage agent
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # PYTHONUNBUFFERED matters twice: uvicorn's access log is the only
          # visibility into which incidents arrived, and a buffered stream means
          # the Actions console shows nothing until the job ends. The sentinel
          # writes to /tmp/sentinel.log separately, but the agent's does not.
          #
          # The two SREK3S_MANIFEST_* variables are separate and both are
          # required. SREK3S_MANIFEST_ROOT is where the GitOps checkout is;
          # without it the provider is `unreadable_manifest_provider()` and every
          # incident escalates under I-B2. SREK3S_TARGET_MANIFEST is *which*
          # file inside that checkout the patch targets - the default,
          # deploy/payments/checkout-api.yaml, does not exist in this repository,
          # so without this the agent reads a missing file and escalates anyway.
          #
          # Set here rather than by hardcoding a namespace->manifest map in
          # triage.py: the routing belongs to the harness, and the production
          # default is unchanged when the variable is absent.
          SREK3S_SANDBOX=1 \
          SREK3S_LOG_LEVEL=INFO \
          SREK3S_MANIFEST_ROOT="$PWD" \
          SREK3S_TARGET_MANIFEST="deploy/chaos/oom-leak.yaml" \
          PYTHONUNBUFFERED=1 \
          PYTHONPATH="$PWD/agent" \
            nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 \
            > /tmp/agent.log 2>&1 &
          echo $! > /tmp/agent.pid
          for i in $(seq 1 30); do
            # --max-time: without it a hung TCP connect to a dead port can sit
            # past the kernel's default and eat the whole step budget.
            if curl -fsS --max-time 5 http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
              echo "agent healthy after ${i}s"
              curl -fsS --max-time 5 http://127.0.0.1:8000/healthz
              echo
              exit 0
            fi
            sleep 1
          done
          echo "::error::the agent never became healthy"
          cat /tmp/agent.log
          exit 1

      # ---------------------------------------------------------------
      # 6b. The wire capture proxy.
      #
      # ROADMAP 4.2.1 requires the runner to "collect emitted payloads", and
      # 4.2.4 through 4.2.7 are all assertions over collected payloads. Until
      # something put the wire bytes where the runner could see them, the
      # runner's incidents list was always empty and its step exited 1 on every
      # run - which is exactly what run 36644304837 showed, after twenty-four
      # green steps.
      #
      # It sits in front of the agent rather than inside the Sentinel because
      # ARCHITECTURE.md line 30 puts the scrubber behind "no disk, no plaintext
      # retention", and the harness must stay external to the binary whose
      # behaviour it measures. No production code is touched.
      #
      # Started after the agent so the upstream is already listening, and
      # before the Sentinel so no incident can be emitted past it. Anything the
      # Sentinel posts that does not arrive here is invisible to the harness,
      # which is the failure mode this whole step exists to prevent.
      # ---------------------------------------------------------------
      - name: Start the wire capture proxy
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # `-m capture_proxy`, not `python capture_proxy.py`. The step runs from
          # the repository root, where there is no capture_proxy.py, so the
          # script-path form exits immediately with "No such file or
          # directory" - which is what run 36649783834 did. `-m` plus
          # PYTHONPATH is what the agent step above already does, and it does not
          # depend on the working directory.
          PYTHONUNBUFFERED=1 \
          PYTHONPATH="$PWD/tests/e2e" \
            nohup python -m capture_proxy \
              --output /tmp/captured_incidents.jsonl \
              --listen-port 8001 \
              --upstream-port 8000 \
              > /tmp/capture_proxy.log 2>&1 &
          echo $! > /tmp/capture_proxy.pid

          # Liveness by process, not by HTTP. The proxy forwards every path, so
          # there is no endpoint of its own to probe without inventing one on a
          # component whose whole job is to be transparent; and a proxy that is
          # up but not yet accepting is exactly the state worth catching here
          # rather than discovering as a missing capture at the end of the run.
          #
          # The double `kill -0` is deliberate. A single check passes for a
          # process that has started and is about to exit, which is precisely
          # the failure this step exists to catch; re-checking after a second
          # separates "started" from "stayed up".
          for i in $(seq 1 30); do
            if ! kill -0 "$(cat /tmp/capture_proxy.pid)" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if ! kill -0 "$(cat /tmp/capture_proxy.pid)" 2>/dev/null; then
            echo "::error::the capture proxy did not stay up"
            cat /tmp/capture_proxy.log
            exit 1
          fi
          echo "capture proxy alive (pid $(cat /tmp/capture_proxy.pid))"
          cat /tmp/capture_proxy.log

      # ---------------------------------------------------------------
      # 8. The Sentinel, scoped.
      #
      # The assertion is on the *log line the watcher reports back*, not on the
      # flag value. Before the M4 fix these were the same string while the
      # informer ignored the flag entirely, and the log was simply untrue - so
      # checking the flag would have passed against a cluster-wide watch.
      #
      # -agent-url is the agent's ROOT, not an endpoint. The emitter appends
      # IncidentsPath ("/v1/incidents") to it - emitter.go builds
      # `incidentsURL: baseURL + IncidentsPath` - so this flag must not carry a
      # path of its own. It briefly did: repointing the Sentinel at the capture
      # proxy kept the old alias path and produced
      # /api/v1/triage/v1/incidents, which the agent 404s. The proxy recorded
      # the exchange anyway, which is why this cost two runs to find rather than
      # one: the capture was non-empty and every invariant had something real to
      # chew on, just from a payload the agent had never validated.
      # ---------------------------------------------------------------
      - name: Start the Sentinel, scoped to the chaos namespace
        timeout-minutes: 5
        run: |
          set -euo pipefail
          ./bin/sentinel \
            -namespace "$CHAOS_NAMESPACE" \
            -agent-url http://127.0.0.1:8001 \
            -log-level info \
            > /tmp/sentinel.log 2>&1 &
          echo $! > /tmp/sentinel.pid
          sleep 5
          cat /tmp/sentinel.log
          if ! grep -q "watching one namespace" /tmp/sentinel.log; then
            echo "::error::the Sentinel did not report a namespace scope; it is watching every namespace"
            exit 1
          fi
          grep -q "\"namespace\":\"$CHAOS_NAMESPACE\"" /tmp/sentinel.log || {
            echo "::error::the reported scope is not $CHAOS_NAMESPACE"
            exit 1
          }

      # ---------------------------------------------------------------
      # 9. Detonate.
      #
      # The observation window is not arbitrary. The kubelet restarts a failed
      # container *immediately* the first time - no backoff entry exists yet - and
      # only enters backoff from the second failure, so CrashLoopBackOff is
      # unobservable before ~10s. A 5s or 10s deadline fails against a fixture
      # that is working perfectly.
      # ---------------------------------------------------------------
      # ---------------------------------------------------------------
      # 7a. Start the invariant runner BEFORE the fixture.
      #
      # This ordering is the whole point, and getting it wrong is silent.
      # `check_causal_chain` verifies that Terminated{137} preceded
      # Waiting{CrashLoopBackOff}, and by the time a pod reaches
      # CrashLoopBackOff the kubelet has already cleared `state.terminated`:
      # the 137 survives only in `lastState`, which `read_observation` files
      # under previous_exit_code, not exit_code, and `is_oom` requires
      # `exit_code == 137`. A runner whose window opens after the restart can
      # therefore only ever observe the symptom, and the check fails with
      # "never observed Terminated{exit_code: 137}" however healthy the system
      # under test was.
      #
      # The previous revision applied the fixture, waited for the pod to reach
      # its failure state, and only then started the runner - guaranteeing the
      # window opened too late. The runner's own docstring states the
      # requirement that wiring contradicted.
      #
      # Backgrounded with the exit code written to a file, because `wait`
      # cannot reach a job started in a previous step's shell and the verdict
      # has to survive to the step that reports it.
      # ---------------------------------------------------------------
      - name: Start the E2E invariant runner (samples the whole lifecycle)
        timeout-minutes: 5
        run: |
          set -uo pipefail
          rm -f /tmp/runner.exit
          (
            rc=0
            PYTHONUNBUFFERED=1 python tests/e2e/runner.py 'srek3s.io/chaos=oom' \
              --namespace "$CHAOS_NAMESPACE" \
              --observe-seconds "${OBSERVATION_WINDOW:-90}" \
              --incident-file /tmp/captured_incidents.jsonl \
              --manifest deploy/chaos/oom-leak.yaml \
              --snapshot-before /tmp/snapshot-before.yaml \
              --snapshot-after /tmp/snapshot-after.yaml \
              > /tmp/runner.log 2>&1 || rc=$?
            echo "$rc" > /tmp/runner.exit
          ) &
          echo $! > /tmp/runner.pid
          sleep 2
          if [ -f /tmp/runner.exit ]; then
            echo "::error::the runner exited immediately; it must outlive the fixture"
            cat /tmp/runner.log
            exit 1
          fi
          echo "runner sampling for ${OBSERVATION_WINDOW:-90}s (pid $(cat /tmp/runner.pid))"

      - name: Apply the OOM chaos fixture (ROADMAP 4.1.2)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # BOTH fixtures, in one step, because the Tier-2 box needs the
          # CrashLoopBackOff pod running and a second apply step could be
          # reordered, dropped, or land after the runner's window closed.
          #
          # deploy/chaos/crashloop.yaml already exists, is labelled
          # `srek3s.io/chaos: crashloop`, runs busybox:1.36.1 and plants the same
          # CHAOS-CRED credential set as the OOM fixture. It is applied for
          # exactly that reason. A hand-rolled `exit 1` pod would be worse on
          # three counts: it writes no credentials, so its logs are
          # redaction-inert and the "a [REDACTED] marker is present" half of
          # check_redaction would fail with "nothing was masked"; it would skip
          # the restricted-PSA securityContext that
          # agent/tests/test_chaos_fixtures.py enforces on every fixture; and
          # it would duplicate an artefact that already does the job.
          #
          # WHY THE RUNNER'S SELECTOR IS STILL `srek3s.io/chaos=oom`, and this
          # is the load-bearing decision rather than an oversight. The two
          # pods share a label, and `kubectl get pods -l srek3s.io/chaos` (a
          # bare existence selector) matches BOTH. `get_pod` returns items[0],
          # and the apiserver lists pods by name, so `srek3s-chaos-crashloop-*`
          # sorts ahead of `srek3s-chaos-oom-*` and the runner would sample the
          # crashloop pod only - whose exit code is 1, never 137. That fails
          # check_causal_chain ("never observed Terminated{exit_code: 137}")
          # and check_detection_latency ("no termination with exit_code 137")
          # on every run. Widening `get_pod` to return every matching pod would
          # not fix it either: Observation carries no pod identity, so
          # check_causal_chain would satisfy its two halves from two different
          # containers, and sampler_restart_ceiling would become a cross-pod
          # maximum that widens the tolerance for a fabricated detection. Both
          # are false passes, which cost more than the box they would buy.
          #
          # The Tier-2 incident therefore arrives through the CAPTURE rather
          # than through sampling. check_tier_two_dispatches derives its
          # precondition from the capture (TIER_ONLY_POSSIBLE_REASONS: ARCH 5.3
          # admits Tier-1 only for OOMKilled, so a captured CrashLoopBackOff
          # incident *proves* a Tier-2 response must exist), and the proxy
          # records every POST the Sentinel makes in the chaos namespace. One
          # timeline for the sampler, the other fixture observed where it is
          # actually adjudicated.
          kubectl apply -f deploy/chaos/oom-leak.yaml
          kubectl apply -f deploy/chaos/crashloop.yaml
          kubectl -n "$CHAOS_NAMESPACE" get pods -l srek3s.io/chaos -o wide

      - name: Watch the pod reach its failure state
        # Bounded independently of the loop's own deadline, so a wedged
        # `kubectl` call cannot outlive it.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          window="${OBSERVATION_WINDOW:-90}"
          deadline=$(( $(date +%s) + window ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            status=$(kubectl -n "$CHAOS_NAMESPACE" get pod \
              -l srek3s.io/chaos=oom \
              -o jsonpath='{.items[0].status.containerStatuses[0]}' 2>/dev/null || true)
            echo "  t=$(( $(date +%s) - deadline + window ))s $status"
            case "$status" in
              *'"exitCode":137'*) echo "observed OOMKill (exit 137)"; exit 0 ;;
              *CrashLoopBackOff*) echo "observed CrashLoopBackOff"; exit 0 ;;
            esac
            sleep 2
          done
          echo "::error::the fixture never reached a failure state within ${window}s"
          kubectl -n "$CHAOS_NAMESPACE" describe pod -l srek3s.io/chaos=oom || true
          kubectl -n "$CHAOS_NAMESPACE" logs -l srek3s.io/chaos=oom --tail=40 || true
          exit 1

      - name: Assert the capture is non-empty (ROADMAP 4.2.1)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Its own step, deliberately. "Did the Sentinel emit at all" and "did
          # an invariant fail" are different investigations with different
          # owners, and the runner's message for an empty capture - "no
          # incidents collected" - does not distinguish "the Sentinel never
          # emitted" from "the proxy never saw it". A step name can.
          #
          # A bounded wait goes in front of that assertion, added after run
          # 36726696428. This step used to test for emptiness the instant the
          # previous one returned, and the capture is not written when the
          # Sentinel emits - it is written when the agent finishes answering.
          # The proxy forwards upstream first and appends after the response is
          # read, so the file stays empty for the whole of the agent's bounded
          # inference plus triage plus patch verification. The three preceding
          # runs passed because the agent took the fail-closed Tier-2 exit,
          # which returns an empty patch without synthesising one; giving it a
          # manifest provider made it take the slower Tier-1 path, and the
          # assertion outran it. A harness regression, not a Sentinel one.
          #
          # 20 is measured against two ceilings, not chosen by taste:
          #   * the proxy's upstream timeout is 10s and this workflow does not
          #     raise it. A healthy exchange is on disk within ~10s of the
          #     Sentinel's first POST however slow the inference is; past that
          #     the proxy records its own 502 and the file is non-empty anyway.
          #     20s is twice that, and it is the number that decides whether a
          #     slow run is a Sentinel fault or merely a slower agent.
          #   * the runner's window. It samples for the observation window from
          #     before the fixture is applied and reads the capture only after
          #     sampling ends, so nothing this step does can change what the
          #     runner sees. Worst case the loop below starts at ~T+20s and ends
          #     at ~T+40s against a capture read at ~T+91s - 50s of margin. The
          #     wait is nowhere near able to eat the runner's window.
          # The elapsed seconds are echoed because the two failure shapes are
          # indistinguishable without them: a wait that routinely returns in 0s
          # is not covering the Tier-1 case it was written for, and one that
          # always burns all 20 iterations means the budget is wrong.
          echo "Waiting for Sentinel to emit (Tier-1 patch generation takes several seconds)..."
          wait_started=$SECONDS
          for i in $(seq 1 20); do
            if [ -s /tmp/captured_incidents.jsonl ]; then
              break
            fi
            sleep 1
          done
          echo "capture wait finished after $(( SECONDS - wait_started ))s"

          # The wait above makes *this* assertion patient and nothing else. The
          # runner is what actually judges the run, and its ordering is
          # load-bearing: main() samples first and reads the capture afterwards,
          # because a poll taken after the kubelet has already cleared
          # state.terminated can only ever see CrashLoopBackOff and never the
          # 137 that caused it. So there is a second failure mode the wait does
          # not cover - an emit that lands after the runner has read the file
          # is invisible to it. This step would then pass on a capture the
          # runner never saw, and the run would go red four steps later at
          # "Runner verdict" with a message about a missing capture rather than
          # about a timing window. Named here, where the timing is.
          if [ -s /tmp/captured_incidents.jsonl ]; then
            runner_pid="$(cat /tmp/runner.pid 2>/dev/null || true)"
            if [ -z "$runner_pid" ]; then
              echo "::warning::no /tmp/runner.pid; cannot confirm the runner is still sampling"
            elif kill -0 "$runner_pid" 2>/dev/null; then
              echo "runner still sampling (pid $runner_pid); it reads the capture when its window closes"
            else
              echo "::error::the capture is non-empty but the invariant runner (pid $runner_pid) has already exited."
              echo "::error::That is a harness timing fault, not a Sentinel failure: the runner"
              echo "::error::samples first and reads the capture afterwards, so an emit landing"
              echo "::error::after it exits cannot be seen by it. Left alone this surfaces four"
              echo "::error::steps later as a missing-capture invariant, which names the wrong half."
              echo "runner exit code: $(cat /tmp/runner.exit 2>/dev/null || echo '(none written)')"
              exit 1
            fi
          fi
          if [ ! -s /tmp/captured_incidents.jsonl ]; then
            echo "::error::the capture file is empty: the Sentinel emitted nothing,"
            echo "::error::or emitted past the proxy. Both are failures."
            exit 1
          fi
          echo "captured $(wc -l < /tmp/captured_incidents.jsonl | tr -d ' ') exchange(s):"
          # No embedded python here on purpose. A multi-line `python -c` inside
          # a YAML block scalar has to be indented to the block, and getting
          # that wrong breaks the parse rather than the command - and the raw
          # capture is dumped in the triage step below anyway.
          grep -o '"incident_id":"[^"]*"' /tmp/captured_incidents.jsonl || true
          grep -o '"restart_count":[0-9]*' /tmp/captured_incidents.jsonl || true
          grep -o '"upstream_status":[0-9]*' /tmp/captured_incidents.jsonl || true

      - name: Run the E2E invariant runner (ROADMAP 4.2.1)
        timeout-minutes: 10
        run: |
          set -uo pipefail
          # This step exits 0 even when the runner fails, and that is deliberate.
          # It ran with `exit "$rc"` and the eleven invariant steps behind it were
          # all SKIPPED - GitHub skips the remainder of a job after a failing step,
          # so the one mechanism built to name the failing invariant never ran.
          # The verdict belongs to the invariant steps; this one only produces
          # the log they read. A runner failure nothing explains is caught by the
          # "Runner verdict" step after them.
          deadline=$((SECONDS + 420))
          while [ ! -f /tmp/runner.exit ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::the runner never finished; it should have exited by now"
              cat /tmp/runner.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/runner.log
          echo "runner exit code: $(cat /tmp/runner.exit) (reported by the steps that follow)"

      # ---------------------------------------------------------------
      # 10. The patch, verified against a real repository.
      #
      # Separate from the runner because the runner cannot reach this: over HTTP
      # the agent escalates (no manifest provider), so the patch is generated
      # in-process where one can be injected, and then handed to real git. That
      # is the check whose absence let the P0 ship - the M2 suite verified
      # generator output against a checker that silently repaired it, and never
      # asked git about a diff the generator had actually produced.
      # ---------------------------------------------------------------
      # ---------------------------------------------------------------
      # Each invariant as its own step.
      #
      # The runner already reports every broken invariant at once, which is
      # right for a human with a log and useless for anyone reading step
      # conclusions - all the unauthenticated API returns. These steps do no
      # checking of their own: each matches the failure text that one invariant
      # alone can produce and re-reports it as a conclusion, so the failing
      # step's *name* is the diagnosis.
      #
      # The strings are duplicated from runner.py rather than shared. That
      # duplication is the cost, and a real one: rename a message in runner.py
      # and the matching step goes quietly green. They are checked against
      # runner.py at authoring time for exactly that reason.
      # ---------------------------------------------------------------

      - name: "Invariant: Logs were captured (non-empty, within the 100-line tail)"
        timeout-minutes: 2
        run: |
          set -uo pipefail
          # No checking of its own. The runner already judged this invariant
          # and wrote its verdict into /tmp/runner.log; this step only matches
          # the text that invariant alone can produce and re-reports it as a
          # step conclusion, because with CI logs returning 403 a step name is
          # the finest diagnostic a reviewer has.
          if grep -qF "scrubbed_logs is empty" /tmp/runner.log ||
          grep -qF "scrubbed_logs has" /tmp/runner.log ||
          grep -qF "want list" /tmp/runner.log; then
            echo "::error::invariant failed: Logs were captured (non-empty, within the 100-line tail)"
            grep -nF -e "scrubbed_logs is empty" /tmp/runner.log || true
            exit 1
          fi
          echo "  ok: Logs were captured (non-empty, within the 100-line tail)"


      - name: "Invariant: No planted secret survived scrubbing"
        timeout-minutes: 2
        run: |
          set -uo pipefail
          # No checking of its own. The runner already judged this invariant
          # and wrote its verdict into /tmp/runner.log; this step only matches
          # the text that invariant alone can produce and re-reports it as a
          # step conclusion, because with CI logs returning 403 a step name is
          # the finest diagnostic a reviewer has.
          if             grep -qF "planted secret(s) in its scrubbed_logs" /tmp/runner.log; then
            echo "::error::invariant failed: No planted secret survived scrubbing"
            grep -nF -e "planted secret(s) in its scrubbed_logs" /tmp/runner.log || true
            exit 1
          fi
          echo "  ok: No planted secret survived scrubbing"


      - name: "Invariant: Scrubbing actually masked something"
        timeout-minutes: 2
        run: |
          set -uo pipefail
          # No checking of its own. The runner already judged this invariant
          # and wrote its verdict into /tmp/runner.log; this step only matches
          # the text that invariant alone can produce and re-reports it as a
          # step conclusion, because with CI logs returning 403 a step name is
          # the finest diagnostic a reviewer has.
          if             grep -qF "scrubbed_logs contain no [REDACTED] marker" /tmp/runner.log; then
            echo "::error::invariant failed: Scrubbing actually masked something"
            grep -nF -e "scrubbed_logs contain no [REDACTED] marker" /tmp/runner.log || true
            exit 1
          fi
          echo "  ok: Scrubbing actually masked something"


      - name: "Invariant: Masking preserved diagnostic evidence"
        timeout-minutes: 2
        run: |
          set -uo pipefail
          # No checking of its own. The runner already judged this invariant
          # and wrote its verdict into /tmp/runner.log; this step only matches
          # the text that invariant alone can produce and re-reports it as a
          # step conclusion, because with CI logs returning 403 a step name is
          # the finest diagnostic a reviewer has.
          if             grep -qF "no planted-credential marker survived" /tmp/runner.log; then
            echo "::error::invariant failed: Masking preserved diagnostic evidence"
            grep -nF -e "no planted-credential marker survived" /tmp/runner.log || true
            exit 1
          fi
          echo "  ok: Masking preserved diagnostic evidence"


      - name: "Invariant: The container entered backoff (restart_count>=2)"
        timeout-minutes: 2
        run: |
          set -uo pipefail
          # No checking of its own. The runner already judged this invariant
          # and wrote its verdict into /tmp/runner.log; this step only matches
          # the text that invariant alone can produce and re-reports it as a
          # step conclusion, because with CI logs returning 403 a step name is
          # the finest diagnostic a reviewer has.
          if             grep -qF "no incident reached restart_count>=2" /tmp/runner.log; then
            echo "::error::invariant failed: The container entered backoff (restart_count>=2)"
            grep -nF -e "no incident reached restart_count>=2" /tmp/runner.log || true
            exit 1
          fi
          echo "  ok: The container entered backoff (restart_count>=2)"


      - name: "Invariant: Only mappable reasons were emitted"
        timeout-minutes: 2
        run: |
          set -uo pipefail
          # No checking of its own. The runner already judged this invariant
          # and wrote its verdict into /tmp/runner.log; this step only matches
          # the text that invariant alone can produce and re-reports it as a
          # step conclusion, because with CI logs returning 403 a step name is
          # the finest diagnostic a reviewer has.
          if             grep -qF "carry a reason outside" /tmp/runner.log; then
            echo "::error::invariant failed: Only mappable reasons were emitted"
            grep -nF -e "carry a reason outside" /tmp/runner.log || true
            exit 1
          fi
          echo "  ok: Only mappable reasons were emitted"


      - name: "Invariant: OOMKilled(137) was observed"
        timeout-minutes: 2
        run: |
          set -uo pipefail
          # No checking of its own. The runner already judged this invariant
          # and wrote its verdict into /tmp/runner.log; this step only matches
          # the text that invariant alone can produce and re-reports it as a
          # step conclusion, because with CI logs returning 403 a step name is
          # the finest diagnostic a reviewer has.
          if grep -qF "never observed Terminated" /tmp/runner.log ||
          grep -qF "no observations; the pod was never seen" /tmp/runner.log; then
            echo "::error::invariant failed: OOMKilled(137) was observed"
            grep -nF -e "never observed Terminated" /tmp/runner.log || true
            exit 1
          fi
          echo "  ok: OOMKilled(137) was observed"


      - name: "Invariant: CrashLoopBackOff was observed"
        timeout-minutes: 2
        run: |
          set -uo pipefail
          # No checking of its own. The runner already judged this invariant
          # and wrote its verdict into /tmp/runner.log; this step only matches
          # the text that invariant alone can produce and re-reports it as a
          # step conclusion, because with CI logs returning 403 a step name is
          # the finest diagnostic a reviewer has.
          if             grep -qF "never Waiting{{CrashLoopBackOff}}" /tmp/runner.log; then
            echo "::error::invariant failed: CrashLoopBackOff was observed"
            grep -nF -e "never Waiting{{CrashLoopBackOff}}" /tmp/runner.log || true
            exit 1
          fi
          echo "  ok: CrashLoopBackOff was observed"


      - name: "Invariant: The cause preceded the effect"
        timeout-minutes: 2
        run: |
          set -uo pipefail
          # No checking of its own. The runner already judged this invariant
          # and wrote its verdict into /tmp/runner.log; this step only matches
          # the text that invariant alone can produce and re-reports it as a
          # step conclusion, because with CI logs returning 403 a step name is
          # the finest diagnostic a reviewer has.
          if             grep -qF "causal chain is inverted" /tmp/runner.log; then
            echo "::error::invariant failed: The cause preceded the effect"
            grep -nF -e "causal chain is inverted" /tmp/runner.log || true
            exit 1
          fi
          echo "  ok: The cause preceded the effect"


      - name: "Invariant: Backoff samples carried the cause"
        timeout-minutes: 2
        run: |
          set -uo pipefail
          # No checking of its own. The runner already judged this invariant
          # and wrote its verdict into /tmp/runner.log; this step only matches
          # the text that invariant alone can produce and re-reports it as a
          # step conclusion, because with CI logs returning 403 a step name is
          # the finest diagnostic a reviewer has.
          if             grep -qF "sample carried previous_reason" /tmp/runner.log; then
            echo "::error::invariant failed: Backoff samples carried the cause"
            grep -nF -e "sample carried previous_reason" /tmp/runner.log || true
            exit 1
          fi
          echo "  ok: Backoff samples carried the cause"


      - name: "Invariant: Enough samples to see a chain at all"
        timeout-minutes: 2
        run: |
          set -uo pipefail
          # No checking of its own. The runner already judged this invariant
          # and wrote its verdict into /tmp/runner.log; this step only matches
          # the text that invariant alone can produce and re-reports it as a
          # step conclusion, because with CI logs returning 403 a step name is
          # the finest diagnostic a reviewer has.
          if             grep -qF "observation(s); the causal chain needs" /tmp/runner.log; then
            echo "::error::invariant failed: Enough samples to see a chain at all"
            grep -nF -e "observation(s); the causal chain needs" /tmp/runner.log || true
            exit 1
          fi
          echo "  ok: Enough samples to see a chain at all"

      - name: "Runner verdict (catches failures no invariant explains)"
        timeout-minutes: 2
        run: |
          set -uo pipefail
          # Last line of defence, and it exists because the step above now
          # exits 0. The eleven invariant steps each match one failure text; a
          # runner that died on a bad JSON line, a kubectl error or an
          # unhandled exception would leave all of them green. This catches that,
          # and it is ordered last so a specific invariant failure is the step a
          # reviewer sees - a failing step skips the rest of the job.
          rc=$(cat /tmp/runner.exit 2>/dev/null || echo 1)
          if [ "$rc" != "0" ]; then
            echo "::error::the runner exited $rc but no invariant step reported a failure."
            echo "::error::The failure is outside the eleven invariants - likely a crash,"
            echo "::error::a kubectl error, or an unreadable capture file."
            tail -20 /tmp/runner.log || true
            exit 1
          fi
          echo "  ok: the runner returned 0 and every invariant held"


      - name: M4.3 - Live Post-Remediation Verification Loop
        # Placed after the M4.2 invariant block and after the `if: failure()`
        # triage log, and before Exfiltrate/Teardown. Two orderings matter here:
        #
        #   * After "Agent log", so a failure in this step does not skip the
        #     diagnostics written for the M4.2 half. Inserted before it, a red
        #     M4.3 run would take the triage log with it and leave a failure
        #     nobody could read.
        #   * Before "Teardown", which is `if: always()`, so the namespace this
        #     step creates is still deleted on the way out.
        #
        # Milestone 4.3.4. The test owns `srek3s-verify-chaos` - it creates the
        # namespace, applies tests/fixtures/bounded-leak.yaml, patches the memory
        # limit 64Mi -> 128Mi with real `git apply`, and observes the workload
        # through the same `agent/verify.py` loop the product uses. It then
        # re-injects the fault and observes the OOM recur.
        #
        # The two assertions that make this worth running rather than a
        # formality: the reader that feeds the loop is proved read-only, and the
        # loop itself is proved to reach VERIFIED/CLOSE_INCIDENT on a real fix
        # and UNRESOLVED/PROMOTE_TO_TIER_2 on a re-injected one.
        #
        # `SREK3S_LIVE_E2E=1` is what unskips the `@pytest.mark.live` cases.
        # Without it they skip with a message that says BLOCKED DEPENDENCY -
        # correct behaviour for a laptop, and exactly wrong here, where a cluster
        # is sitting right there. KUBECONFIG was exported to GITHUB_ENV when k3s
        # was installed; it is repeated here so the step does not depend on that
        # being remembered.
        env:
          SREK3S_LIVE_E2E: "1"
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        timeout-minutes: 15
        run: |
          set -uo pipefail
          echo "=== preflight: is the busybox image the fixture needs actually present? ==="
          # Checked before the tests rather than discovered by them. The fixture
          # uses `imagePullPolicy: Never` because the workflow pre-pulls busybox
          # into k3s containerd; if that import silently regressed, every
          # container in this step would sit ImagePullBackOff and the verdict
          # would be a confusing UNRESOLVED rather than an honest setup error.
          if kubectl -n default get pods >/dev/null 2>&1; then
            echo "  ok: kubectl reaches the API server"
          else
            echo "::error::kubectl cannot reach the API server in the M4.3 step"
            kubectl cluster-info 2>&1 | head -20 || true
            exit 1
          fi
          # Captured to a variable first, then matched from the variable, with no
          # pipe - identical to the ratified "Verify k3s Image Registration" step
          # above. The first draft of this check used
          # `sudo k3s ctr ... | grep -qF ...` and it reported the image MISSING on
          # a cluster where it was present and every other fixture had already
          # started: `grep -q` exits the instant it matches, the writer takes
          # SIGPIPE, and `pipefail` hands that 141 to the pipeline in place of
          # grep's 0. That is the defect in docs/lessons-learned.md section 6,
          # reintroduced verbatim in the same milestone that quoted it, and it is
          # why this step reuses the ratified form instead of a fresh one.
          # `--timeout 30s` because ctr's default of 0 means wait-forever, and a
          # step timeout is reported by CI as `failure` - byte-identical to an
          # error, so an unbounded wait is indistinguishable from a real one.
          images=$(sudo k3s ctr --timeout 30s --namespace k8s.io images list) || {
            echo "::error::could not list images in the k8s.io namespace for the M4.3 step"
            exit 1
          }
          # -F: the reference is a literal and the dots in `docker.io` are not a
          # pattern to be interpreted.
          grep -qF 'docker.io/library/busybox:1.36.1' <<<"$images" || {
            echo "::error::busybox:1.36.1 is not in k3s containerd; the bounded fixture cannot start"
            grep -i busybox <<<"$images" || echo "  (no busybox image at all)"
            exit 1
          }
          echo "  ok: busybox:1.36.1 registered in k3s containerd"

          echo
          echo "=== M4.3 live verification loop ==="
          python -m pytest agent/tests/test_verification_e2e.py -v

          rc=$?
          echo
          echo "=== the verification namespace must be gone (ROADMAP 4.3.4 teardown) ==="
          if kubectl get namespace srek3s-verify-chaos >/dev/null 2>&1; then
            echo "::error::srek3s-verify-chaos survived the test; teardown did not run"
            exit 1
          fi
          echo "  ok: srek3s-verify-chaos was removed"

          echo
          echo "=== ROADMAP 4.2.8 must be unaffected: sentinel-chaos is untouched by M4.3 ==="
          # The whole reason the verification namespace is separate. If this step
          # had applied its fixture into sentinel-chaos, the object count 4.2.8
          # reports would change and the invariant above would be reading a
          # number this step had moved. Asserted here so a future edit that
          # collapses the isolation fails loudly instead of quietly weakening a
          # ratified invariant.
          if kubectl get deployment -n sentinel-chaos srek3s-verify-bounded >/dev/null 2>&1; then
            echo "::error::the verification fixture leaked into sentinel-chaos"
            exit 1
          fi
          echo "  ok: no verification objects in sentinel-chaos"
          exit $rc

      - name: Agent log (for triage on failure)
        if: failure()
        # `continue-on-error`: a diagnostic step that fails would replace the real
        # failure with its own, which is the worst outcome for a triage log.
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "=== agent ==="; cat /tmp/agent.log || true
          echo "=== sentinel ==="; cat /tmp/sentinel.log || true
          echo "=== capture proxy ==="; cat /tmp/capture_proxy.log || true
          echo "=== captured exchanges (one per line) ==="
          cat /tmp/captured_incidents.jsonl 2>/dev/null || \
            echo "(no capture file - the proxy never started)"
          echo "=== sentinel stats ==="
          kubectl -n "$CHAOS_NAMESPACE" describe pod -l srek3s.io/chaos=oom || true

      - name: Exfiltrate Remediation Artifacts
        if: always()
        timeout-minutes: 5
        run: |
          set -uo pipefail
          # if: always() because this is the step that makes a red run
          # diagnosable. Every other diagnostic here lives inside a step that
          # failed; this one exists so a failed run still says what the agent
          # proposed and what changed on the cluster.
          #
          # Single-line commands throughout, on purpose. A multi-line `python -c`
          # inside a YAML block scalar has to carry the block's indentation, and
          # when it does not the file stops being valid YAML - which is how an
          # earlier revision of this step broke the workflow outright.
          echo "=== provider configured on the agent ==="
          grep -m1 "manifest_provider=" /tmp/agent.log || echo "  (no startup line)"

          echo
          echo "=== tiers across captured exchanges ==="
          grep -o '"blast_radius_tier":"[^"]*"' /tmp/captured_incidents.jsonl || echo "  (none)"

          echo
          echo "=== how many exchanges carry an empty patch ==="
          grep -c '"git_patch":""' /tmp/captured_incidents.jsonl || echo 0

          echo
          echo "=== full first TriageResponse ==="
          head -n 1 /tmp/captured_incidents.jsonl > /tmp/one-capture.json
          python tests/e2e/show_capture.py /tmp/one-capture.json || echo "  (unreadable)"

          echo
          echo "=== cluster mutation: before vs after (ROADMAP 4.2.8) ==="
          python tests/e2e/show_mutation.py /tmp/snapshot-before.yaml /tmp/snapshot-after.yaml || echo "  (snapshots unavailable)"

          echo
          echo "=== mutation report file ==="
          if [ -s /tmp/mutation-report.txt ]; then
            cat /tmp/mutation-report.txt
          else
            echo "  (absent - the runner writes no such file; see the commit message)"
          fi

          echo
          echo "=== runner report ==="
          if [ -f /tmp/runner.log ]; then tail -45 /tmp/runner.log; else echo "  (none)"; fi

      # =============================================================
      # In-cluster leg. Additive: steps 1-9 above are untouched, and
      # everything below reuses the k3s instance they installed.
      #
      # What this leg is for
      # -------------------
      # Every step above runs the Sentinel, the agent and the capture proxy as
      # HOST processes on loopback. Only the victim workload is in the cluster.
      # So `deploy/` has never been applied by anything: not the Service, not
      # either NetworkPolicy, not the Role, not readOnlyRootFilesystem, not
      # runAsUser. v1.0.0 shipped a deploy set whose Sentinel pointed at a
      # Service no manifest created, on a port nothing listened on, and every
      # gate was green - because no test opened this directory.
      #
      # These steps apply it and watch it route.
      #
      # What this leg does NOT do, stated up front
      # -------------------------------------------
      # It does not detonate anything. Detection, scrubbing, classification and
      # patch generation are proven by the steps above, against a real cluster,
      # with a real OOM. Repeating that here would duplicate the ratified
      # Milestone 4.1/4.2 evidence to re-prove a chain that is not in question.
      # What is in question is whether the deploy set applies and routes, and
      # that is a different question with a different answer.
      #
      # It also does not start the Sentinel, and that is a gap rather than a
      # choice: deploy/sentinel.yaml references
      # registry.internal/srek3s-sentinel:0.1.0 and nothing in this repository
      # builds that image. docs/offline-install.md line 105 documents
      # `docker build -f Dockerfile` for it, and there is no root Dockerfile -
      # the only one is agent/Dockerfile. So the Deployment object is asserted
      # to be created, and its pod is not waited on. Closing that needs an
      # image, which is a separate piece of work.
      # =============================================================

      - name: "E2E-IN: build and import the agent image into k3s containerd"
        timeout-minutes: 20
        run: |
          set -euo pipefail

          # The tag must be exactly what deploy/agent.yaml names. A tag mismatch
          # produces ImagePullBackOff, which reads like a network fault rather
          # than the configuration error it is, and the leg's own image has to
          # be right before anything else can be diagnosed.
          AGENT_IMAGE="registry.internal/srek3s-agent:0.1.0"

          # The build context is the repository root, not agent/. Same reason
          # AGENTS.md gives: the Dockerfile needs agent/ and its config.
          docker build -t "$AGENT_IMAGE" -f agent/Dockerfile .

          docker save "$AGENT_IMAGE" -o /tmp/srek3s-agent.tar

          # --namespace k8s.io, not --all-namespaces. This cluster is already
          # running with images pulled into k8s.io, so the explicit namespace is
          # the idempotent form: the import lands where kubelet actually looks
          # and is visible in `images list` afterwards. docs/offline-install.md
          # records both forms and says which is which; this is Mechanism B's
          # repeated-import case, and it remains the unverified one.
          sudo k3s ctr --timeout 120s --namespace k8s.io images import \
            /tmp/srek3s-agent.tar --namespace k8s.io

          # The effect, not the exit status. `ctr images import` exiting 0 has
          # been observed to land the image somewhere kubelet never reads, which
          # presents as ImagePullBackOff with no other symptom. So the tag is
          # confirmed present and qualified in the namespace that matters.
          if ! sudo k3s ctr --timeout 30s --namespace k8s.io images list \
               | grep -qF "$AGENT_IMAGE"; then
            echo "::error::$AGENT_IMAGE is not present in the k8s.io namespace"
            sudo k3s ctr --timeout 30s --namespace k8s.io images list || true
            exit 1
          fi
          echo "agent image registered in k8s.io as $AGENT_IMAGE"

      - name: "E2E-IN: create the fixture ConfigMaps"
        timeout-minutes: 5
        run: |
          set -euo pipefail

          # --from-file, not a committed ConfigMap body. The script that runs
          # in-cluster is then byte-identical to the one the offline tests
          # import and the host-process leg runs. A transcribed copy would be a
          # second source of truth for an instrument whose whole value is that
          # it is transparent.
          kubectl -n srek3s-system create configmap srek3s-capture-proxy \
            --from-file=capture_proxy.py=tests/e2e/capture_proxy.py \
            --dry-run=client -o yaml | kubectl apply -f -

          # The agent's manifest root. deploy/chaos/oom-leak.yaml is the real
          # fixture, mounted so the agent reads the same bytes the host-process
          # leg reads.
          kubectl -n srek3s-system create configmap srek3s-agent-gitops \
            --from-file=oom-leak.yaml=deploy/chaos/oom-leak.yaml \
            --dry-run=client -o yaml | kubectl apply -f -

          for cm in srek3s-capture-proxy srek3s-agent-gitops; do
            if ! kubectl -n srek3s-system get configmap "$cm" >/dev/null 2>&1; then
              echo "::error::ConfigMap $cm was not created"
              exit 1
            fi
          done
          echo "both fixture ConfigMaps present"

      - name: "E2E-IN: apply the real deploy set through the overlay"
        timeout-minutes: 10
        run: |
          set -euo pipefail

          # -k, so the base is deploy/ itself rather than a copy. The overlay
          # adds the capture proxy, the chaos-namespace Role and the routing
          # probe; it changes nothing in deploy/. tests/e2e/fixtures/incluster/
          # asserts that relationship, and asserts the base path resolves to the
          # real directory, so a rename breaks the build rather than quietly
          # detaching the base.
          kubectl apply -k tests/e2e/fixtures/incluster

          # Every object the deploy set declares must exist afterwards. Asserted
          # by name, because "kubectl apply exited 0" is not evidence that any
          # particular object was admitted - a namespace that does not exist
          # makes every namespaced object in the set fail while the command
          # still reports success for the ones it got to.
          missing=0
          for ref in \
            "serviceaccount/srek3s-sentinel" \
            "role/srek3s-sentinel" \
            "rolebinding/srek3s-sentinel" \
            "service/srek3s-agent" \
            "deployment/srek3s-agent" \
            "deployment/srek3s-sentinel" \
            "networkpolicy/srek3s-agent-egress" \
            "deployment/srek3s-capture" \
            "service/srek3s-capture" \
            "deployment/srek3s-route-probe" \
          ; do
            if kubectl -n srek3s-system get "$ref" >/dev/null 2>&1; then
              echo "  ok: $ref"
            else
              echo "  MISSING: $ref"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::the deploy set did not fully apply"
            exit 1
          fi

          # The chaos namespace is created by deploy/chaos/namespace.yaml, which
          # step 5 already applied. The overlay's Role binds into it, so a
          # re-apply here would be a no-op at best and a "namespace not found"
          # at worst if the ordering were ever disturbed.
          kubectl -n sentinel-chaos get role srek3s-sentinel >/dev/null
          echo "  ok: role/srek3s-sentinel in sentinel-chaos"

      - name: "E2E-IN: assert the agent Service has ready endpoints"
        timeout-minutes: 8
        run: |
          set -euo pipefail

          # A Service object with no ready endpoints is a valid object and a
          # total routing failure. v1.0.0's Service did not exist at all, so this
          # is the first assertion in the repository that looks at the
          # difference. The check is on endpoints, never on the Service object.
          ok=0
          for i in $(seq 1 60); do
            endpoints="$(kubectl -n srek3s-system get endpoints srek3s-agent \
              -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || true)"
            if [ -n "$endpoints" ]; then
              echo "srek3s-agent has ready endpoints after ${i}0s: $endpoints"
              ok=1
              break
            fi
            echo "  waiting for srek3s-agent endpoints (${i}/60)"
            kubectl -n srek3s-system get pods -l app.kubernetes.io/name=srek3s-agent \
              -o wide || true
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::srek3s-agent never published a ready endpoint; the Service resolves to nothing"
            kubectl -n srek3s-system describe deployment srek3s-agent || true
            kubectl -n srek3s-system get events --sort-by=.lastTimestamp | tail -20 || true
            exit 1
          fi

      - name: "E2E-IN: assert in-cluster DNS routes to the agent Service"
        timeout-minutes: 8
        run: |
          set -euo pipefail

          # This is the assertion the whole leg exists for. A pod inside the
          # cluster resolves `srek3s-agent` through cluster DNS, connects to the
          # Service, and calls a real contract endpoint. Nothing else in the
          # workflow performs that resolution - the steps above all address
          # 127.0.0.1 - so this is the only thing in the repository that would
          # have failed on v1.0.0.
          #
          # The probe exits 0 on success and 1 after its own 120s deadline, so a
          # DNS failure or a policy refusal is a pod that never reaches Ready and
          # is reported as such. `rollout status` is the check; the probe's own
          # stdout carries the status code and body for the receipt.
          if ! kubectl -n srek3s-system rollout status deployment/srek3s-route-probe \
               --timeout=300s; then
            echo "::error::the routing probe never succeeded against http://srek3s-agent:8000"
            echo "--- probe logs ---"
            kubectl -n srek3s-system logs deployment/srek3s-route-probe --tail=40 || true
            echo "--- agent logs ---"
            kubectl -n srek3s-system logs deployment/srek3s-agent --tail=40 || true
            exit 1
          fi

          echo "--- probe output ---"
          kubectl -n srek3s-system logs deployment/srek3s-route-probe --tail=5

          # And the direct contract, so the receipt carries a real status code
          # rather than only a rollout result.
          kubectl -n srek3s-system logs deployment/srek3s-route-probe \
            | grep -q '"ok": true' || {
              echo "::error::the probe reported failure"
              kubectl -n srek3s-system logs deployment/srek3s-route-probe --tail=20 || true
              exit 1
            }
          echo "in-cluster DNS resolved srek3s-agent and the agent answered /healthz"

      - name: "E2E-IN: build and import the Sentinel image into k3s containerd"
        timeout-minutes: 20
        run: |
          set -euo pipefail

          # deploy/sentinel.yaml references registry.internal/srek3s-sentinel:0.1.0
          # and execs /bin/sentinel -version, and until cmd/sentinel/Dockerfile
          # existed nothing in this repository could produce either. The tag must
          # match the manifest exactly; a mismatch is ImagePullBackOff, which
          # reads like a network fault rather than the configuration error it is.
          SENTINEL_IMAGE="registry.internal/srek3s-sentinel:0.1.0"

          # Repository-root context, not cmd/sentinel/. go.mod and the packages
          # being compiled live outside that directory, so a narrower context
          # fails at the COPY with an error that does not mention the context.
          docker build \
            --build-arg "VERSION=0.1.0-e2e" \
            -t "$SENTINEL_IMAGE" \
            -f cmd/sentinel/Dockerfile .

          docker save "$SENTINEL_IMAGE" -o /tmp/srek3s-sentinel.tar

          sudo k3s ctr --timeout 120s --namespace k8s.io images import \
            /tmp/srek3s-sentinel.tar --namespace k8s.io

          # The effect, not the exit status. An import that lands outside k8s.io
          # exits 0 and presents as ImagePullBackOff with no other symptom, so
          # the tag is confirmed present where kubelet actually looks.
          if ! sudo k3s ctr --timeout 30s --namespace k8s.io images list \
               | grep -qF "$SENTINEL_IMAGE"; then
            echo "::error::$SENTINEL_IMAGE is not present in the k8s.io namespace"
            sudo k3s ctr --timeout 30s --namespace k8s.io images list || true
            exit 1
          fi
          echo "sentinel image registered in k8s.io as $SENTINEL_IMAGE"

      - name: "E2E-IN: deploy the Sentinel and assert it is scoped and read-only"
        timeout-minutes: 10
        run: |
          set -euo pipefail

          # The Sentinel is now deployable, so the overlay's chaos-namespace Role
          # has a consumer. `kubectl apply -k` already created the Role and the
          # binding; this asserts the pod actually starts, which is the part that
          # needs an image and could not be asserted before.
          #
          # Scoped to the chaos namespace, exactly as the runbook instructs. That
          # is only authorised because extra-resources.yaml grants the Sentinel's
          # ServiceAccount a read-only Role there - deploy/rbac.yaml grants one in
          # srek3s-system only, which is the gap the runbook now documents.
          kubectl -n sentinel-chaos patch deployment srek3s-sentinel --type=strategic -p '{
            "spec": {"template": {"spec": {"containers": [
              {"name": "sentinel", "env": [
                {"name": "SREK3S_AGENT_URL", "value": "http://srek3s-capture:8000"}
              ]}
            ]}}}
          }' >/dev/null

          if ! kubectl -n srek3s-system rollout status deployment/srek3s-sentinel \
               --timeout=300s; then
            echo "::error::the Sentinel did not become ready in-cluster"
            kubectl -n srek3s-system describe deployment srek3s-sentinel || true
            kubectl -n srek3s-system logs deployment/srek3s-sentinel --tail=60 || true
            kubectl -n srek3s-system get events --sort-by=.lastTimestamp | tail -20 || true
            exit 1
          fi

          echo "--- the Sentinel's own startup log ---"
          kubectl -n srek3s-system logs deployment/srek3s-sentinel --tail=20

          # The startup line, not the flag. The Milestone 4 preflight found
          # `-namespace` decorative - read and logged, then ignored by an informer
          # watching every namespace - so the log asserted a scoping that was not
          # in effect and nothing failed. Asserting the flag would pass against a
          # cluster-wide watch; asserting the line the watcher reports back is the
          # observation that can distinguish them.
          kubectl -n srek3s-system logs deployment/srek3s-sentinel \
            | grep -q "watching one namespace" || {
              echo "::error::the in-cluster Sentinel did not report a namespace scope"
              kubectl -n srek3s-system logs deployment/srek3s-sentinel --tail=30 || true
              exit 1
            }

          # And the UID, observed from inside the container rather than from the
          # manifest. deploy/sentinel.yaml and cmd/sentinel/Dockerfile both declare
          # 10001 and a test asserts they agree; this asserts the running process
          # agrees with both.
          uid="$(kubectl -n srek3s-system exec deploy/srek3s-sentinel -- id -u 2>/dev/null || echo unknown)"
          echo "  in-container uid: $uid"
          if [ "$uid" != "10001" ]; then
            echo "::error::the in-cluster Sentinel runs as uid $uid, not 10001"
            exit 1
          fi
          echo "  ok: the in-cluster Sentinel runs as UID 10001"

          # The -version exec that the liveness probe depends on. Asserted through
          # a rollout already, but explicitly here so a failure names the probe
          # rather than the rollout.
          kubectl -n srek3s-system exec deploy/srek3s-sentinel -- /bin/sentinel -version \
            || { echo "::error::/bin/sentinel -version did not exit 0; the exec liveness probe cannot pass"; exit 1; }

      - name: "E2E-IN: assert the Sentinel's in-cluster RBAC is read-only"
        timeout-minutes: 5
        run: |
          set -euo pipefail

          # The real identity, in both namespaces it now holds a grant in. This
          # is the same check the runbook tells an operator to run by hand, run
          # here against a live apiserver instead of asserted by a manifest test.
          SA=system:serviceaccount:srek3s-system:srek3s-sentinel
          for verb in get list watch; do
            for resource in pods events; do
              for ns in srek3s-system sentinel-chaos; do
                if ! kubectl auth can-i "$verb" "$resource" -n "$ns" --as="$SA" 2>/dev/null \
                     | grep -qx yes; then
                  echo "::error::$SA cannot $verb $resource in $ns; the read-only path is broken"
                  exit 1
                fi
              done
            done
          done
          echo "  ok: get/list/watch on pods and events, in both namespaces"

          # The negative half, which is the half that matters. A manifest test
          # can prove the Role does not *name* a write verb; only the apiserver
          # can prove the identity is *refused*.
          for verb in create patch update delete; do
            for resource in pods deployments; do
              answer="$(kubectl auth can-i "$verb" "$resource" -n sentinel-chaos \
                --as="$SA" 2>/dev/null || echo no)"
              if [ "$answer" = "yes" ]; then
                echo "::error::$SA is GRANTED $verb on $resource; the no-autofix guarantee does not hold"
                exit 1
              fi
              echo "  ok: refused $verb on $resource"
            done
          done

          # And the agent must hold nothing at all, which is a stronger form of
          # the same property.
          AGENT_SA=system:serviceaccount:srek3s-system:srek3s-agent
          for verb in get list watch create patch delete; do
            answer="$(kubectl auth can-i "$verb" pods -n srek3s-system \
              --as="$AGENT_SA" 2>/dev/null || echo no)"
            if [ "$answer" = "yes" ]; then
              echo "::error::the agent ServiceAccount is granted $verb on pods; it is meant to hold no cluster credential"
              exit 1
            fi
          done
          echo "  ok: the agent's ServiceAccount holds no cluster access at all"

      - name: "E2E-IN: assert the hardening holds on the running agent"
        timeout-minutes: 5
        run: |
          set -euo pipefail

          # Read from the live pod's resolved spec, not from the manifest. The
          # manifest is what the manifests tests parse; this is what the kubelet
          # actually admitted, which is the thing an attacker would meet.
          pod="$(kubectl -n srek3s-system get pod \
            -l app.kubernetes.io/name=srek3s-agent \
            -o jsonpath='{.items[0].metadata.name}')"
          if [ -z "$pod" ]; then
            echo "::error::no agent pod to inspect"
            exit 1
          fi

          uid="$(kubectl -n srek3s-system get pod "$pod" \
            -o jsonpath='{.spec.containers[0].securityContext.runAsUser}')"
          if [ "$uid" != "10001" ]; then
            echo "::error::the running agent runs as UID $uid, not 10001"
            exit 1
          fi
          echo "  ok: runAsUser 10001"

          ror="$(kubectl -n srek3s-system get pod "$pod" \
            -o jsonpath='{.spec.containers[0].securityContext.readOnlyRootFilesystem}')"
          if [ "$ror" != "true" ]; then
            echo "::error::the running agent's root filesystem is writable (readOnlyRootFilesystem=$ror)"
            exit 1
          fi
          echo "  ok: readOnlyRootFilesystem"

          dropped="$(kubectl -n srek3s-system get pod "$pod" \
            -o jsonpath='{.spec.containers[0].securityContext.capabilities.drop}')"
          if ! grep -q ALL <<<"$dropped"; then
            echo "::error::the running agent does not drop ALL capabilities (drop=$dropped)"
            exit 1
          fi
          echo "  ok: capabilities drop ALL"

          # I-B5's stronger form, observed rather than declared: the agent pod
          # has no ServiceAccount token mounted, so it cannot reach the API
          # server even if a future bug tried to.
          token="$(kubectl -n srek3s-system get pod "$pod" \
            -o jsonpath='{.spec.automountServiceAccountToken}')"
          if [ "$token" != "false" ]; then
            echo "::error::the agent pod has automountServiceAccountToken=$token; it should mount no token"
            exit 1
          fi
          echo "  ok: no ServiceAccount token on the agent pod"

          echo "--- the agent's own UID, from inside the container ---"
          kubectl -n srek3s-system exec "$pod" -- id -u || true

      - name: Teardown
        if: always()
        # No timeout needed: every command in it is `|| true` or a kill, and a
        # teardown that hangs would keep the runner reserved for its own budget.
        run: |
          set -uo pipefail
          # The fixtures are disposable and the namespace is labelled for exactly
          # this, but leaving a crash-looping pod on a shared runner wastes the
          # minutes before the job's own timeout ends.
          kubectl delete namespace "$CHAOS_NAMESPACE" --ignore-not-found --timeout=60s || true
          for pidfile in /tmp/agent.pid /tmp/sentinel.pid; do
            [ -f "$pidfile" ] && kill "$(cat "$pidfile")" 2>/dev/null || true
          done
