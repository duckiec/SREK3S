name: release

# Publish multi-architecture images when a version tag is pushed.
#
# WHY A SEPARATE WORKFLOW. ci.yaml runs on every push and pull request and must
# never have push credentials. This one runs only on `v*` tags and only holds
# `packages: write`. Splitting them means a compromised test dependency cannot
# reach a registry token, because the workflow that installs third-party packages
# on every PR is not the workflow that holds the token.
#
# ---------------------------------------------------------------------------
# THE TAG IS THE TRUTH, AND IT IS CHECKED
# ---------------------------------------------------------------------------
# The published version comes from the git tag, not from a file, a branch name, or
# a version string inside the source. `main.version` in cmd/sentinel/main.go is a
# placeholder — `0.1.0-dev` — and the build stamps over it. So there is exactly
# one place a version can come from, and it is the thing a human pushed.
#
# The consistency check below exists because the alternative is worse: a tag that
# does not match the committed image tags would publish v1.2.3 as an image whose
# manifests still say 0.1.0, and nothing downstream would notice until someone
# pinned the wrong artefact.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SENTINEL_IMAGE: srek3s-sentinel
  AGENT_IMAGE: srek3s-agent

jobs:
  validate-tag:
    name: Validate the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A semantic version, and nothing else. `v1.2.3-rc1` is allowed; `latest`,
      # `main`, and `foo` are not, because a release tag that is not a version
      # makes the published tag set unreproducible.
      #
      # The `v` prefix is STRIPPED for the image tag. A tag cannot contain both
      # `v1.2.3` and `1.2.3` without ambiguity about which one is canonical, and
      # the OCI convention is a bare semver.
      - name: Extract and validate the version
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "  raw tag   : $tag"
          echo "  version   : $version"
          if ! printf '%s' "$version" \
            | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$tag' is not a semantic version (expected vMAJOR.MINOR.PATCH[-PRERELEASE])"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "  valid semver"

      # The committed image tags and this workflow's outputs must describe the same
      # release. They are written in different files today, which is exactly why a
      # mismatch would not otherwise be caught.
      - name: Report the committed image references (not a gate)
        run: |
          version="${{ steps.tag.outputs.version }}"
          echo "manifests declare:"
          grep -h 'image: registry.internal' deploy/sentinel.yaml deploy/agent.yaml \
            | sed 's/^/  /'
          echo
          echo "release will publish:"
          echo "  ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.SENTINEL_IMAGE }}:$version"
          echo "  ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.AGENT_IMAGE }}:$version"
          echo
          echo "NOTE: deploy/*.yaml reference registry.internal/*, which is the"
          echo "in-cluster tag. GHCR images are published under a different"
          echo "registry, so deploying from this repository requires rewriting"
          echo "the image reference — see README 'Publishing'."
          echo
          echo "This step is a REPORT and deliberately cannot fail. An earlier"
          echo "version was named 'Check the tag against the committed image"
          echo "references' while containing no comparison and no non-zero exit"
          echo "- a guard that cannot fail, wearing a name that says it can."
          echo "An equality assertion is not available either: the manifests"
          echo "carry 0.1.0 and a release publishes the tag, so that would be a"
          echo "permanent red build over a documented registry mismatch. If the"
          echo "manifests are ever repointed at the published registry, this"
          echo "becomes a real check and the name becomes accurate again."

  publish:
    name: Publish multi-arch images to GHCR
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The default GITHUB_TOKEN, which is correct and is the point: no long-lived
      # registry credential is stored in this repository, so there is nothing to
      # leak, rotate, or accidentally print in a log.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image references
        id: refs
        run: |
          base="${{ env.REGISTRY }}/${{ github.repository_owner }}"
          echo "sentinel=${base}/${{ env.SENTINEL_IMAGE }}" >> "$GITHUB_OUTPUT"
          echo "agent=${base}/${{ env.AGENT_IMAGE }}" >> "$GITHUB_OUTPUT"
          echo "  sentinel: ${base}/${{ env.SENTINEL_IMAGE }}"
          echo "  agent   : ${base}/${{ env.AGENT_IMAGE }}"

      # TAGS carries three values on purpose:
      #
      #   :${{ version }}  the immutable artefact. This is the tag to pin.
      #   :latest          convenience for the default branch.
      #   :v${{ version }} the tag as a human pushed it, without stripping the v.
      #
      # The third exists because someone will `docker pull .../srek3s-agent:v1.0.0`
      # having typed what they pushed, and an image that is not there under that
      # name is a support ticket. `:latest` is documented in the README as
      # unsuitable for production, because it moves.
      - name: Build and push the Sentinel (multi-arch)
        id: build-sentinel
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        timeout-minutes: 20
        with:
          context: .
          file: cmd/sentinel/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # A release is reproducible in the sense that matters: the same tag always
          # resolves to a manifest list naming both architectures, so a node that
          # cannot use one of them fails visibly at pull time rather than running
          # the wrong binary.
          tags: |
            ${{ steps.refs.outputs.sentinel }}:${{ needs.validate-tag.outputs.version }}
            ${{ steps.refs.outputs.sentinel }}:v${{ needs.validate-tag.outputs.version }}
            ${{ steps.refs.outputs.sentinel }}:latest
          labels: |
            org.opencontainers.image.title=srek3s-sentinel
            org.opencontainers.image.description=Read-only Kubernetes failure watcher; emits scrubbed incidents
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.validate-tag.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push the Agent (multi-arch)
        id: build-agent
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        timeout-minutes: 20
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.refs.outputs.agent }}:${{ needs.validate-tag.outputs.version }}
            ${{ steps.refs.outputs.agent }}:v${{ needs.validate-tag.outputs.version }}
            ${{ steps.refs.outputs.agent }}:latest
          labels: |
            org.opencontainers.image.title=srek3s-agent
            org.opencontainers.image.description=Deterministic triage agent; scrubbed telemetry in, verified RCA out
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.validate-tag.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      # A push that reports success but produced a single-platform image is a
      # release that works on the machine that built it and nowhere else. Reading
      # the manifest list back is the only way to know what was actually published.
      - name: Verify both images are multi-arch
        timeout-minutes: 10
        run: |
          set -euo pipefail
          version="${{ needs.validate-tag.outputs.version }}"

          # A push that reports success but produced a single-platform image is a
          # release that works on the machine that built it and nowhere else.
          # Reading the manifest list back is the only way to know what was
          # actually published rather than what was requested.
          #
          # The raw JSON goes to a file and the parser is a quoted heredoc, so the
          # shell's quote handling is out of the picture entirely. Piping into
          # `python3 -c '...'` would force the Python to avoid single quotes, and
          # `inspect --raw | grep -q` is worse: `grep -q` exits on first match,
          # the writer takes SIGPIPE and dies 141, and pipefail reports a passing
          # check as failing. Measured on this project at 60 failures in 60 runs.
          # See docs/lessons-learned.md.
          manifest=$(mktemp)
          for image in "${{ steps.refs.outputs.sentinel }}" "${{ steps.refs.outputs.agent }}"; do
            echo "--- $image:$version"
            docker buildx imagetools inspect "$image:$version" --raw > "$manifest"

            platforms=$(python3 - "$manifest" <<'PY'
          import json, sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              document = json.load(handle)

          found = set()
          for entry in document.get("manifests", []):
              platform = entry.get("platform") or {}
              operating_system, architecture = platform.get("os"), platform.get("architecture")
              if operating_system and architecture:
                  found.add(f"{operating_system}/{architecture}")
          print(" ".join(sorted(found)))
          PY
            )

            echo "  platforms: $platforms"

            # By NAME, not by count. The previous version asserted
            # len(manifests) >= 2, which a manifest list carrying two entries for
            # the SAME architecture satisfies. The step's own comment claimed the
            # guarantee was "a node that cannot use one of them fails visibly at
            # pull time rather than running the wrong binary" - and that claim
            # needs both architectures specifically, so both are required by name.
            missing=0
            for required in linux/amd64 linux/arm64; do
              case " $platforms " in
                *" $required "*)
                  echo "  [ok] $required"
                  ;;
                *)
                  echo "::error::$image:$version is missing $required (found: ${platforms:-none}); a release must cover amd64 and arm64"
                  missing=1
                  ;;
              esac
            done
            test "$missing" -eq 0
          done
          rm -f "$manifest"

          echo
          echo "both images published as amd64+arm64 manifest lists"

      # Pin these digests into deploy/overlays/*/kustomization.yaml when you cut
      # the next deploy. The digest identifies the manifest list exactly; a tag
      # only identifies it approximately.
      - name: Print the deployment digests
        run: |
          {
            echo "## Deployment digests"
            echo
            echo "Pin these in \`deploy/overlays/*/kustomization.yaml\`:"
            echo
            echo "Sentinel: \`${{ steps.refs.outputs.sentinel }}@${{ steps.build-sentinel.outputs.digest }}\`"
            echo "Agent:    \`${{ steps.refs.outputs.agent }}@${{ steps.build-agent.outputs.digest }}\`"
          } | tee /tmp/digests.txt
          {
            echo
            echo "### Deployment digests"
            echo
            echo "\`${{ steps.refs.outputs.sentinel }}@${{ steps.build-sentinel.outputs.digest }}\`"
            echo
            echo "\`${{ steps.refs.outputs.agent }}@${{ steps.build-agent.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Pin the real image digests into the Kustomize overlays and open a PR
      # with them. Pushing to main directly is blocked by branch protection,
      # so this pushes a branch and lets reviewers merge the pin.
      - name: Auto-pin Kustomize digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SENTINEL_DIGEST="${{ steps.build-sentinel.outputs.digest }}"
          AGENT_DIGEST="${{ steps.build-agent.outputs.digest }}"

          python3 - "$SENTINEL_DIGEST" "$AGENT_DIGEST" <<'PY'
          import re, sys

          sentinel_digest, agent_digest = sys.argv[1], sys.argv[2]
          # Match any 64-hex digest, not only the all-zero placeholder. After the
          # first release the overlays carry real digests, so matching only 0{64}
          # made the substitution a no-op and left the pin branch with zero
          # commits - which failed `gh pr create` ("No commits between main").
          # Matching the existing digest lets each release refresh the pins.
          placeholder = re.compile(r"sha256:[0-9a-f]{64}")

          for path in (
              "deploy/overlays/quickstart/kustomization.yaml",
              "deploy/overlays/quickstart-live/kustomization.yaml",
          ):
              text = open(path, encoding="utf-8").read()
              lines = text.splitlines(keepends=True)
              out = []
              current = None
              for line in lines:
                  if "name: registry.internal/srek3s-sentinel" in line:
                      current = "sentinel"
                  elif "name: registry.internal/srek3s-agent" in line:
                      current = "agent"
                  elif current and placeholder.search(line):
                      line = placeholder.sub({"sentinel": sentinel_digest, "agent": agent_digest}[current], line)
                      current = None
                  out.append(line)
              open(path, "w", encoding="utf-8").write("".join(out))
          PY

          git add deploy/overlays/
          # A no-op substitution (digests already current for this ref) must not
          # fail the release: `gh pr create` errors on a branch with no commits.
          # Stage first, and only branch/commit/push/PR when the substitution
          # actually changed something.
          if git diff-index --cached --quiet HEAD; then
            echo "::notice::Kustomize digests are already current for ${{ github.ref_name }}; nothing to pin"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="release/pin-digests-${{ github.ref_name }}"
          git checkout -b "$BRANCH_NAME"
          git commit -m "chore(release): pin image digests for ${{ github.ref_name }}"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "chore: pin image digests for ${{ github.ref_name }}" \
            --body "Automated Kustomize image digest pinning for release ${{ github.ref_name }}." \
            --base main

      - name: Summarise the release
        run: |
          {
            echo "## Published ${{ needs.validate-tag.outputs.version }}"
            echo
            echo "| image | tags |"
            echo "|-------|------|"
            echo "| \`${{ steps.refs.outputs.sentinel }}\` | \`:${{ needs.validate-tag.outputs.version }}\`, \`:latest\` |"
            echo "| \`${{ steps.refs.outputs.agent }}\` | \`:${{ needs.validate-tag.outputs.version }}\`, \`:latest\` |"
            echo
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"