# OOM restart-loop manifest fixture.
#
# Referenced by the Milestone 2 terminal validation test, which asserts that a
# generated `git_patch` passes `git apply --check` against this file and raises
# `resources.limits.memory`.
#
# It is deliberately a realistic Deployment rather than a minimal one:
#   - `requests.memory` differs from `limits.memory`, so a generator that matched
#     on text alone could confuse the two blocks;
#   - `cpu` sits adjacent to `memory` inside `limits`, so the patch has real
#     neighbouring context to carry;
#   - the line count puts the target more than three lines from either end of the
#     relevant block, so hunk offsets are not trivially zero.
#
# The container name `checkout-api` matches `container_name` in
# `tests/fixtures/sample-incident.json`. The two files are a pair: the incident
# reports a 256Mi limit, and this manifest is what the patch is applied to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: payments
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: payments-platform
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: checkout-api
          image: registry.internal/checkout-api:1.4.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "250m"
          volumeMounts:
            - name: config
              mountPath: /etc/checkout
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: checkout-api-config
