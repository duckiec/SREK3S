# Strategic-merge patch: populate the agent's GitOps manifest root, in-cluster.
#
# What the agent actually needs
# -----------------------------
# SREK3S_MANIFEST_ROOT must point at a directory containing
# SREK3S_TARGET_MANIFEST, and SREK3S_TARGET_MANIFEST must name a manifest
# extension (classifier.py's _MANIFEST_SUFFIXES). It does *not* need a real git
# repository: patch.py's git_apply_check materialises the manifest into its own
# throwaway repository inside a temp dir precisely so that I-B2 does not depend
# on a checkout being present.
#
# So the minimum in-cluster is: one readable file, at a repo-relative path, plus
# the `git` binary (already in agent/Dockerfile) plus a writable temp dir
# (already mounted at /tmp). This patch supplies exactly that and nothing more.
#
# deploy/agent.yaml now ships the `manifests` volume and the
# SREK3S_MANIFEST_ROOT env var, both pointing at /manifests, so this patch does
# NOT redefine the volume - the shipped emptyDir is exactly what an init
# container needs to write into, and redeclaring it would be a second place for
# the two files to disagree. The only things added are the init container and
# the ConfigMap it reads from.
#
# The fixture is deploy/chaos/oom-leak.yaml, NOT tests/fixtures/bounded-leak.yaml
# ----------------------------------------------------------------------------
# A directive asked for bounded-leak.yaml here. That is the wrong file for this
# leg, for a reason worth writing down rather than silently overriding.
#
# bounded-leak.yaml is the Milestone 4.3.4 live-verification fixture
# (srek3s-verify-bounded). Its own header says that deploy/chaos/oom-leak.yaml
# *cannot* verify a remediation, because raising the memory limit on a
# continuously-leaking workload only delays the OOMKill. So the two fixtures have
# deliberately opposite meanings.
#
# For a patch target the constraint is different and simpler: the diff must apply
# to the manifest the incident actually came from. The detonation applies
# deploy/chaos/oom-leak.yaml to the cluster, the Sentinel reads that workload's
# spec, and the agent's diff is derived from those bytes. Pointing
# SREK3S_TARGET_MANIFEST at bounded-leak.yaml would produce a perfectly valid
# diff against a file that is not the deployed workload - and
# test_the_patch_supplies_exactly_what_the_manifest_provider_reads asserts the
# target exists, not that it is the *right* one. That check is here so the next
# person to make this substitution finds it.
#
# Why an init container rather than a subPath mount
# -------------------------------------------------
# A ConfigMap volume with `subPath` can place a single file at a nested path, and
# it would be one fewer moving part. It was not used because its behaviour when
# the parent directories do not already exist in the image is not something this
# repository can verify offline, and this fixture has never been run against a
# cluster. An init container that runs `mkdir -p` and `cp` states the intent
# outright and depends on nothing subtle.
#
# The ConfigMap is created by the workflow rather than committed here, because
# its content is deploy/chaos/oom-leak.yaml and a committed copy would be a
# second source of truth for a fixture that already exists. `kubectl create
# configmap --from-file` puts the real bytes in, so the manifest the agent reads
# in-cluster is the manifest the cluster is running.
#
# Why the init container is held to the same standard as the agent
# ----------------------------------------------------------------
# deploy/agent.yaml's containers run as UID 10001, non-root, no privilege
# escalation, all capabilities dropped, RuntimeDefault seccomp. The init
# container runs the same image and carries the same block. A fixture that
# exempted itself from the policy it exists to test would make the
# `kubectl auth can-i` evidence and the pod-security evidence worth less than
# nothing - the run would still be green.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srek3s-agent
  namespace: srek3s-system
spec:
  template:
    spec:
      initContainers:
        - name: stage-manifests
          image: registry.internal/srek3s-agent:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /manifests/deploy/chaos
              cp /staged/oom-leak.yaml /manifests/deploy/chaos/oom-leak.yaml
              # Fail loudly here rather than letting the agent discover it later.
              # An empty manifest root is not an error the agent raises - it is a
              # fail-closed Tier-2 escalation, which looks like a working
              # classification decision. A staging step that silently produced
              # nothing would produce 100% Tier-2 and a green run.
              test -s /manifests/deploy/chaos/oom-leak.yaml
              echo "staged $(wc -c < /manifests/deploy/chaos/oom-leak.yaml) bytes"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Writable: this is the shipped emptyDir, and the copy has to land
            # somewhere. The agent's own mount of it is readOnly, so after
            # staging the triage path still cannot modify what it diffs against.
            - name: manifests
              mountPath: /manifests
            - name: manifest-source
              mountPath: /staged
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              cpu: "500m"
              ephemeral-storage: "32Mi"
      containers:
        - name: agent
          env:
            # SREK3S_MANIFEST_ROOT is already /manifests in deploy/agent.yaml, so
            # it is NOT restated here - restating it would be a second place for
            # the manifest and the patch to disagree. Only the target is added.
            - name: SREK3S_TARGET_MANIFEST
              value: deploy/chaos/oom-leak.yaml
      volumes:
        # `manifests` is the shipped emptyDir and is deliberately not repeated.
        #
        # The ConfigMap name must match what the workflow actually creates:
        # srek3s-agent-gitops. It was `srek3s-agent-manifests` here, which read
        # better and was wrong, and the result was a pod that hung in `Init:0/1`
        # for the full eight-minute step timeout with no IP, no restarts and no
        # message: kubelet cannot mount a ConfigMap that does not exist, so the
        # init container never starts and never fails. Nothing reports it as
        # missing; the pod simply never becomes ready.
        #
        # The workflow's own existence assertion passed throughout, because it
        # checked the two names it creates — and neither was the one anything
        # mounted. A green assertion about a name nothing uses.
        #
        # test_every_configmap_the_overlay_mounts_is_one_the_workflow_creates
        # now ties the two files together, so the names cannot drift apart again.
        - name: manifest-source
          configMap:
            name: srek3s-agent-gitops
            defaultMode: 0444
