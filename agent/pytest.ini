[pytest]
# Keeps test collection anchored at agent/ so `import models` resolves without
# an installed package, which is how ARCH §3.1 describes the layout: a single
# flat module, not a distributed package.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --strict-config
markers =
    # A test that needs a real cluster. Strict markers means an unregistered
    # marker is a collection error, not a warning, so a typo cannot quietly
    # turn a live test into one that never runs.
    #
    # The offline halves of a live file are deliberately left unmarked: they are
    # the part that runs on every machine, and marking them would make
    # `-m "not live"` skip the only assertions that were actually exercised.
    # `pytest -m "not live"` therefore runs the whole suite minus the cluster
    # round-trips, which is what the local gate wants.
    live: needs a reachable k3s cluster with the chaos fixtures applied

