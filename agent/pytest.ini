[pytest]
# Keeps test collection anchored at agent/ so `import models` resolves without
# an installed package, which is how ARCH §3.1 describes the layout: a single
# flat module, not a distributed package.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --strict-config
