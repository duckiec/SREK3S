# Tool configuration for the Python gates (AGENTS.md §4: G4, G5, G6).
#
# Deliberately at the repository ROOT, not in agent/. The charter's gate commands
# are run from the root - `flake8 agent/`, `mypy --strict agent/` - and flake8
# and mypy both resolve their configuration relative to the current working
# directory. A config file inside agent/ is therefore invisible to those exact
# invocations, which is how this file's first version silently did nothing and
# left G5 reporting 79-column violations against black-formatted code.

[flake8]
# 88 matches black's default line length, so the two tools cannot disagree about
# the same line. That disagreement is the usual cause of an unresolvable
# black/flake8 conflict.
max-line-length = 88
# E203 and W503 are the two codes black is documented to conflict with; both are
# false positives against black-formatted code.
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist
per-file-ignores =
    # Test fixtures carry long synthetic payloads and unbreakable string
    # literals by design.
    agent/tests/*: E501
    # tests/benchmarks/ is deliberately NOT ignored. The load generator is
    # 1400 lines of code that will be pointed at a production-shaped service,
    # and an E501 exemption there would be the first place a real gate went
    # soft after being added deliberately.

[mypy]
# G6 is `mypy --strict`, so strictness is the baseline here too, for anyone
# running a plain `mypy agent/`.
python_version = 3.11
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_reexport = True
strict_equality = True
show_error_codes = True
pretty = True
mypy_path = agent
# No per-module overrides. `mypy --strict` already enforces
# disallow_untyped_defs and disallow_any_generics everywhere, and the tests
# that pass unvalidated `dict[str, Any]` values do so through the `model_validate`
# boundary, which is typed as taking Any by design. An earlier per-module
# relaxation existed here and matched nothing, because pytest/mypy see the test
# module under a different qualified name than the pattern assumed.
